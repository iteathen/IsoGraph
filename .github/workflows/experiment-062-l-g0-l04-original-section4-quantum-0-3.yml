name: Experiment 062 L G0 original L04 section4 per-row owner source corrected 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l-g0-l04-original-section4-quantum-commutators-0-3.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_135.json'
      - 'experiments/062/L04_SECTION4_SECOND_59_HOSTILE_OWNER_ESCAPE_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l04-original-section4-quantum-0-3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-section4-QFT-conserved:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-section4-quantum-commutators-0-3.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-section4-quantum-commutators-0-3.mjs
