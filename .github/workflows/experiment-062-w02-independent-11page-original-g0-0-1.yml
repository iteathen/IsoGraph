name: "Experiment 062 W02 independent 11-page original PDF G0 audit 0.1"
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - "experiments/062/W02_G0_INDEPENDENT_11_PAGE_ORIGINAL_SOURCE_FIRST_0_1.json"
      - "experiments/062/tools/verify-w02-independent-11page-original-g0-0-1.cjs"
      - ".github/workflows/experiment-062-w02-independent-11page-original-g0-0-1.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  w02_original_pdf_independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Verify new independently source-first W02 11-page original and 24 hostile controls
        run: |
          node --check experiments/062/tools/verify-w02-independent-11page-original-g0-0-1.cjs
          node experiments/062/tools/verify-w02-independent-11page-original-g0-0-1.cjs
