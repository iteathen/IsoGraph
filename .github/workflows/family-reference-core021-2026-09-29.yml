name: Refresh IsoGraph family reference for Core 0.21

on:
  push:
    branches:
      - qualification/core021-rendering-conservation-20260929
    paths:
      - maintenance/FAMILY_REFERENCE_CORE021_2026-09-29.request

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Update maintained DOCX
        env:
          AUTHORITY_SNAPSHOT: ${{ github.sha }}
        run: |
          set -euo pipefail
          node maintenance/update-family-reference-core021-2026-09-29.mjs
      - name: Render and deterministic QA
        run: |
          set -euo pipefail
          mkdir -p out/family-reference/render
          if command -v libreoffice >/dev/null 2>&1; then
            OFFICE=libreoffice
          elif command -v soffice >/dev/null 2>&1; then
            OFFICE=soffice
          else
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
            OFFICE=libreoffice
          fi
          "$OFFICE" --headless --convert-to pdf --outdir out/family-reference IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx
          PDF=out/family-reference/IsoGraph_Family_Reference_Joshua_Oshiro_2026.pdf
          test -s "$PDF"
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftoppm -png -r 120 "$PDF" out/family-reference/render/page
          ls out/family-reference/render/page-*.png >/dev/null
          unzip -p IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx word/document.xml > out/family-reference/document.xml
          grep -F "Current Qualified Authority - 2026-09-29 Core 0.21" out/family-reference/document.xml
          grep -F "CURRENT_INTEGRATED_STACK_WITH_CORE_0_21_2026-09-29.md" out/family-reference/document.xml
          PAGE_COUNT=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test "$PAGE_COUNT" -gt 0
          DOCX_SHA=$(sha256sum IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx | awk '{print $1}')
          DOCX_BYTES=$(stat -c %s IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx)
          cat > maintenance/FINAL_PRODUCT_REFRESH_2026-09-29.md <<EOF
          # Final Product Refresh — 2026-09-29 Core 0.21

          **Status:** repository-root DOCX refreshed; deterministic render complete; visual QA artifact published
          **Authority snapshot represented:** ${GITHUB_SHA}
          **DOCX:** IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx
          **DOCX SHA-256:** ${DOCX_SHA}
          **DOCX bytes:** ${DOCX_BYTES}
          **Rendered pages:** ${PAGE_COUNT}
          **QA workflow run:** ${GITHUB_RUN_ID}

          The accumulated reference routes qualified Core through 0.21, QU 0.1, NEI 0.4, Discovery Protocols through 0.10, DTS 0.1, Experimental Inquiry 0.1, and the Experiment 059+060 expanded-stack integration result.

          Repository semantic authority remains the exact versioned specifications, qualification records, and qualification/QUALIFIED_MODULES_2026-09-29_CORE_0_21.md.

          The prior duplicated page-break defect is repaired in this refreshed artifact. Visual page QA is required before final merge.

          The ChatGPT Library mirror remains a separate publication projection.
          EOF
      - name: Upload Core 0.21 QA render
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-reference-core021-2026-09-29-qa
          path: |
            IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx
            out/family-reference/IsoGraph_Family_Reference_Joshua_Oshiro_2026.pdf
            out/family-reference/render/page-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Persist refreshed final product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx maintenance/FINAL_PRODUCT_REFRESH_2026-09-29.md
          git commit -m "Refresh IsoGraph family reference for Core 0.21"
          git fetch origin qualification/core021-rendering-conservation-20260929
          git rebase origin/qualification/core021-rendering-conservation-20260929
          git push origin HEAD:qualification/core021-rendering-conservation-20260929
      - name: Cleanup transient QA artifact
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/cleanup-github-actions-storage.mjs
