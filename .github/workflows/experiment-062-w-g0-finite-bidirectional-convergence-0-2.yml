name: Experiment 062 W G0 finite bidirectional original-source convergence 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G0_FINITE_BIDIRECTIONAL_CONVERGENCE_0_2.json'
      - 'experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-2.cjs'
      - 'research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_64.json'
      - 'experiments/062/W01_G0_FULL_ORIGINAL_SOURCE_BIDIRECTIONAL_0_1.json'
      - 'experiments/062/W02_G0_VERSIONED_FULL_ORIGINAL_SOURCE_REVERSE_0_1.json'
      - 'experiments/062/W05_G0_VERSIONED_FULL_SOURCE_FIRST_PDF_HTML_0_2.json'
      - 'experiments/062/W_G0_FINITE_SOURCE_FIRST_COVERAGE_BASELINE_0_1.json'
      - 'experiments/062/W_G0_LINE_BY_LINE_151_COVERAGE_0_49.json'
      - 'experiments/062/W_G0_ALL_151_SOURCE_MEMBERSHIP_REGISTER_0_50.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_124.json'
      - '.github/workflows/experiment-062-w-g0-finite-bidirectional-convergence-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-2.cjs
      - run: node experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-2.cjs
