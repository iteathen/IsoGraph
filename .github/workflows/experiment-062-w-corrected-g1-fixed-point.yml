name: Experiment 062 W corrected G1 fixed point verify
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/W_G1_COMPLETE_REPEAT_AUDIT_0_2.json'
      - 'experiments/062/W_G1_OWNER_BYPASS_ROUTING_0_1.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_4.json'
      - 'experiments/062/tools/verify-w-g1-corrected-fixed-point-0-2.mjs'
      - '.github/workflows/experiment-062-w-corrected-g1-fixed-point.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/verify-w-g1-corrected-fixed-point-0-2.mjs
