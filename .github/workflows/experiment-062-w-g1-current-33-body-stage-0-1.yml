name: Experiment 062 W G1 33-body current-source stage qualification 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_SOURCE_LOCAL_CONVERGENCE_STAGE_0_7.json'
      - 'experiments/062/tools/verify-w-g1-current-33-body-stage-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-current-33-body-stage-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g1-current-33-body-stage-0-1.cjs
      - name: Reconcile all 151 W current-body stage and reject 25 adversarial false promotions
        run: node experiments/062/tools/verify-w-g1-current-33-body-stage-0-1.cjs
      - name: Validate six original W04a source-local occurrence bodies and 28 hostile
        run: node experiments/062/tools/verify-w-g1-w04a-six-0-3.cjs
      - name: Preserve older W27 and current frozen G0 original correspondence
        run: |
          node experiments/062/tools/verify-w-g1-current-27-body-stage-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
