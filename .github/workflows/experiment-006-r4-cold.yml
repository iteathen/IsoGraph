name: Experiment 006 R4 focused DP qualification

on:
  workflow_dispatch:
  push:
    branches:
      - spec/nei-qu-rewrite
    paths:
      - experiments/006/RUN_Q006_R4.request

permissions:
  contents: read

concurrency:
  group: experiment-006-r4-focused
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.5-flash

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact qualification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Deterministic preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/006/tools/run-q006-r4-cold.mjs
          node --check experiments/006/tools/score-q006-r4.mjs
          test -f extensions/nei/NATURAL_ENTROPIC_IDENTITY_SPEC_0_2_CANDIDATE.md
          test -f extensions/discovery/DISCOVERY_PROTOCOLS_0_4_CANDIDATE.md
          test -f experiments/006/COLD_Q006_R4_PROMPT.md

      - name: Execute focused cold semantic call
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/006/tools/run-q006-r4-cold.mjs

      - name: Score focused frozen output
        if: always()
        run: node experiments/006/tools/score-q006-r4.mjs

      - name: Upload focused qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isograph-exp006-RUN-Q006-R4
          path: out/q006r4/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce focused disposition
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$COLD_OUTCOME" != "success" ]; then
            echo "Cold execution did not complete successfully: $COLD_OUTCOME" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='out/q006r4/RUN-Q006-R4_SCORE.json';
          if(!fs.existsSync(p)) process.exit(1);
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(`R4 focused DP=${s.disposition}`);
          if(s.disposition!=='QUALIFIES') process.exit(1);
          NODE

# Arm only by creating/updating experiments/006/RUN_Q006_R4.request.
