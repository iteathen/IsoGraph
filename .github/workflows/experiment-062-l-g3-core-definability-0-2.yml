name: Experiment 062 verify L G3 definability 0.2

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G3_CORE_DEFINABILITY_ADJUDICATION_0_2.json'
      - 'experiments/062/L_G3_CORE_DEFINABILITY_0_2.json'
      - 'experiments/062/tools/apply-l-g3-core-definability-adjudication-0-2.mjs'
      - 'experiments/062/tools/verify-l-g3-core-definability-0-2.mjs'
      - '.github/workflows/experiment-062-l-g3-core-definability-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L G3 definability 0.2
        run: node experiments/062/tools/verify-l-g3-core-definability-0-2.mjs
