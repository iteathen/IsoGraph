name: "Experiment 062 W G0 finite source-first formulas and 531 source atoms 0.5"
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - "research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_67.json"
      - "experiments/062/W04E_G0_SOURCE_FIRST_PRINTED_FORMULA_INVERSE_0_1.json"
      - "experiments/062/W_G0_ALL_151_SOURCE_MEMBERSHIP_REGISTER_0_53.json"
      - "experiments/062/W_G0_LINE_BY_LINE_151_COVERAGE_0_52.json"
      - "experiments/062/W_G0_NINE_SOURCE_COVERAGE_STATUS_0_34.json"
      - "experiments/062/W_CURRENT_STAGE_GATE_0_127.json"
      - "experiments/062/W_G0_FINITE_BIDIRECTIONAL_CONVERGENCE_0_5.json"
      - "experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-5.cjs"
      - ".github/workflows/experiment-062-w-g0-source-expressions-0-5.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  w_g0_source_first:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Historical SSC0.66 original source-conservation verification remains valid only for its own old tuple
        run: |
          node --check experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-4.cjs
          node experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-4.cjs
      - name: Verify 0.67 source-first formulas, all 151 SSC inverses, 437 versioned originals and adversarial rejection
        run: |
          node --check experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-5.cjs
          node experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-5.cjs
