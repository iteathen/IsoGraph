name: Experiment 062 L G0 frozen original L04 p11 SSC keys corrected 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-3.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_151.json'
      - 'experiments/062/L04_P11_SECOND_PREDECESSOR_CURRENT_SSC_BINDING_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l04-original-p11-Eq5_4-0-3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-p11-Eq5_4-keys-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-3.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-3.mjs
