name: Experiment 062 L G0 L04 S037 original central product source corrected 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l-g0-l04-s037-source-0-2.mjs'
      - 'experiments/062/L04_S037_2T_D4_FIRST_ORIGINAL_CI_BASELINE_SET_NOTATION_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l04-s037-original-source-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-S037-central-product-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/l04-s037-2T-D4-center-model-0-1.mjs
      - run: node --check experiments/062/tools/verify-l-g0-l04-s037-source-0-2.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-s037-source-0-2.mjs
