name: Experiment 062 W G1 current author finite convergence stage 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_SOURCE_LOCAL_CONVERGENCE_STAGE_0_1.json'
      - 'experiments/062/tools/verify-w-g1-current-convergence-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-current-convergence-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g1-current-convergence-0-1.cjs
      - name: Full W source G1 finite 151-body convergence and 24 adversarial
        run: node experiments/062/tools/verify-w-g1-current-convergence-0-1.cjs
      - name: Requalify every nine W-local repaired author body plus G0 baseline
        run: |
          node experiments/062/tools/verify-w-g1-current-high-risk-0-3.cjs
          node experiments/062/tools/verify-w-g1-four-stale-0-3.cjs
          node experiments/062/tools/verify-w-g1-exact-body-negative-0-2.cjs
          node experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
