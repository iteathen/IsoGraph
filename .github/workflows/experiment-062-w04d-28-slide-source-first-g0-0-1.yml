name: Experiment 062 W04d original 28-slide source-first G0 0.1
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/W04D_G0_28_SLIDE_6_POST_SOURCE_FIRST_0_1.json'
      - 'experiments/062/W04D_G0_FULL_DECK_PREDECESSOR_SOURCE_DEFECT_0_1.json'
      - 'research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_63.json'
