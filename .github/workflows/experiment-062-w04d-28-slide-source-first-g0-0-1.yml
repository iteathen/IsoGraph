      - 'experiments/062/W_G0_NINE_SOURCE_COVERAGE_STATUS_0_30.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_123.json'
      - 'experiments/062/tools/verify-w04d-28-slide-source-first-g0-0-1.cjs'
