name: Experiment 062 W01 section3.1 3.2 exact source conservation v0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_32.json'
      - 'experiments/062/W_G0_W01_SECTION31_32_SOURCE_DEMAND_PROJECTION_0_17.json'
      - 'experiments/062/W_G0_ALL_151_SOURCE_MEMBERSHIP_REGISTER_0_18.json'
      - 'experiments/062/W_G0_LINE_BY_LINE_151_COVERAGE_0_17.json'
      - 'experiments/062/W01_G0_SECTIONS_31_32_PRIMARY_SOURCE_ORACLE_0_1.json'
      - 'experiments/062/W01_G0_SECTIONS_31_32_PRIMARY_SOURCE_ORACLE_0_2.json'
      - 'experiments/062/W01_G0_SECTION31_32_VERIFIER_FREEZE_MUTATION_ESCAPE_0_1.json'
      - 'experiments/062/W01_G0_SECTIONS_31_32_SOURCE_CONSERVATION_DEFECT_0_1.json'
      - 'experiments/062/W01_G0_S31_S32_TARGETED_REVERSE_COVERAGE_0_1.json'
      - 'experiments/062/W01_G0_S31_S32_LOCAL_REPLAY_0_2.json'
      - 'experiments/062/tools/verify-w01-section31-32-source-0-2.mjs'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_60.json'
      - '.github/workflows/experiment-062-w01-section31-32-source-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w01-section31-32-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-quaternion-0-2.mjs
      # Historical 0.7 verifies only gate 0.52/SSC 0.25; do not use it as current W authority.
      - run: node experiments/062/tools/verify-w01-section31-32-current-g0-gate-0-1.mjs
