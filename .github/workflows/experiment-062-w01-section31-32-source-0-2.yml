name: Experiment 062 W01 section3.1 3.2 exact source conservation v0.2
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w01-section31-32-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-quaternion-0-2.mjs
      # Historical 0.7 verifies only gate 0.52/SSC 0.25; do not use it as current W authority.
      - run: node experiments/062/tools/verify-w01-section31-32-current-g0-gate-0-1.mjs
