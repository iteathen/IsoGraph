name: Experiment 043 ternary critical-cover search

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/043/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-043-glycan-critical-cover
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Search and verify critical cover
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/043/tools/run-exp043.mjs
          rm -rf out/exp043
          node experiments/043/tools/run-exp043.mjs

      - name: Persist Experiment 043 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/043/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -f out/exp043/RESULT.json ] && cp out/exp043/RESULT.json "$E/RESULT.json"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 043 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce verified cover
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp043/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp043/RESULT.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(r.disposition!=='PASS') process.exit(1);
          if(r.exact_witness_width!==r.best_cover_size) process.exit(1);
          if(r.threshold_uncovered_words!==0) process.exit(1);
          if(r.missing_private_witnesses!==0) process.exit(1);
          NODE
