name: Experiment 062 verify L G1 0.21

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_EXTRACTION_RECONCILED_0_21.json'
      - 'experiments/062/L_G1_FORMULA_OPERATOR_ADJUDICATION_0_1.json'
      - 'experiments/062/L_G1_FORMULA_OPERATOR_FRONTIER_0_2.json'
      - 'experiments/062/tools/verify-l-extraction-reconciled-0-21.mjs'
      - '.github/workflows/experiment-062-verify-l-g1-0-21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L G1 reconciled 0.21
        run: node experiments/062/tools/verify-l-extraction-reconciled-0-21.mjs
