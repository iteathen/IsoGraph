name: "Experiment 062 W G0 atom-conservation and source inverse 0.3"
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - "research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_65.json"
      - "experiments/062/W_G0_FINITE_BIDIRECTIONAL_CONVERGENCE_0_3.json"
      - "experiments/062/W04E_G0_P09_P12_ATOMIC_SOURCE_FIRST_REPAIR_0_1.json"
      - "experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-3.cjs"
      - ".github/workflows/experiment-062-w-g0-atom-conservation-0-3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w_g0_atom_inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source, 151 owner inverses, 7 distinct live-source atoms, and hostile mutations
        run: node experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-3.cjs
