name: Experiment 062 isolated Woit-Lisi repair models v0.1
on:
  push:
    branches: [research/woit-lisi-repair-sandbox-20261011]
    paths:
      - 'research/woit-lisi-isomorph/repair-layer/**'
      - '.github/workflows/experiment-062-repair-models-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  local-finite-mathematics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22.16.0'}
      - run: node --check research/woit-lisi-isomorph/repair-layer/verify-repairs.cjs
      - run: node research/woit-lisi-isomorph/repair-layer/verify-repairs.cjs
