name: Experiment 062 W G1 W04a original source-first March 5 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_W059_W060_W061_W04A_AUTHOR_ORIGINAL_FIRST_0_1.json'
      - 'experiments/062/tools/verify-w-g1-w04a-059-061-0-1.cjs'
      - 'experiments/062/tools/audit-w-g1-w04a-author-original-0-1.py'
      - '.github/workflows/experiment-062-w-g1-w04a-059-061-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Check independent author-page reader and G1 negative/source relation validator syntax
        run: |
          python3 -m py_compile experiments/062/tools/audit-w-g1-w04a-author-original-0-1.py
          node --check experiments/062/tools/verify-w-g1-w04a-059-061-0-1.cjs
      - name: Original independent author March5 source cold read, two HTTP retrievals and six effective hostiles
        run: python3 -u experiments/062/tools/audit-w-g1-w04a-author-original-0-1.py
      - name: G0-to-G1 source inverse, 20 exact occurrence roles and 27 adversarial controls
        run: node experiments/062/tools/verify-w-g1-w04a-059-061-0-1.cjs
      - name: Verify previous W 24-body stage and frozen nine-source G0 are unmodified
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
