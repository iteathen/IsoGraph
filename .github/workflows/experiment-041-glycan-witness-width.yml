name: Experiment 041 glycan witness-width falsifiers

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/041/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-041-glycan-witness-width
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Execute witness-width checks
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/041/tools/run-exp041.mjs
          rm -rf out/exp041
          node experiments/041/tools/run-exp041.mjs

      - name: Persist Experiment 041 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/041/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -f out/exp041/RESULT.json ] && cp out/exp041/RESULT.json "$E/RESULT.json"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 041 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp041/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp041/RESULT.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(r.disposition!=='PASS') process.exit(1);
          if(r.maximum_verified_width<7) process.exit(1);
          NODE
