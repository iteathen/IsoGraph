name: MIPLIB n5 optimized replication 0.4

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/miplib-structural-presolve-20261006
    paths:
      - .github/workflows/experiment-miplib-n5-optimized-replication.yml
      - research/miplib-structural-presolve/N5_3_OPTIMIZED_END_TO_END_REPLICATION_0_4.md
      - research/miplib-structural-presolve/tools/run-n5-optimized-e2e-replication-0.4.py

permissions:
  contents: write

concurrency:
  group: miplib-n5-optimized-replication-0.4
  cancel-in-progress: false

jobs:
  replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install frozen tools
        run: python3 -m pip install --disable-pip-version-check highspy==1.15.1 igraph==0.11.9 pyscipopt==6.2.1
      - name: Execute replication
        id: experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf out/miplib-n5-optimized-e2e-replication-0.4
          python3 -m py_compile research/miplib-structural-presolve/tools/run-n5-optimized-e2e-replication-0.4.py
          python3 research/miplib-structural-presolve/tools/run-n5-optimized-e2e-replication-0.4.py
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          E="research/miplib-structural-presolve/evidence/n5-optimized-replication-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in RESULT.json SUMMARY.md; do
            [ -f "out/miplib-n5-optimized-e2e-replication-0.4/$f" ] && cp "out/miplib-n5-optimized-e2e-replication-0.4/$f" "$E/$f"
          done
          python3 - <<'PY' > "$E/CONTROL.json"
          import json, os
          print(json.dumps({
            "workflow_run_id": os.environ["GITHUB_RUN_ID"],
            "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "source_sha": os.environ["GITHUB_SHA"],
            "profile": "n5-optimized-end-to-end-replication-0.4"
          },indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: n5 optimized replication ${GITHUB_RUN_ID}"
            for attempt in 1 2 3; do
              git fetch origin experiment/miplib-structural-presolve-20261006
              git rebase origin/experiment/miplib-structural-presolve-20261006
              if git push origin HEAD:experiment/miplib-structural-presolve-20261006; then break; fi
              test "$attempt" -lt 3
            done
          fi
      - name: Enforce replication
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = "success"
          test -f out/miplib-n5-optimized-e2e-replication-0.4/RESULT.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/miplib-n5-optimized-e2e-replication-0.4/RESULT.json"))
          s=r["summary"]
          qualified=(s["paired_both_optimal"]==7 and s["paired_end_to_end_wins"]>=5 and s["median_end_to_end_ratio"]<0.95)
          print(json.dumps({"summary":s,"replication_threshold_pass":qualified},indent=2))
          if not qualified: raise SystemExit(1)
          PY
