name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify repository authority surface
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            STATUS.md
            MIGRATION.md
            AGENTS.md
            CONTRIBUTING.md
            LICENSE
            CORE_SPEC_DRAFT_0_13_CONSOLIDATED_CANDIDATE.md
            CORE_SPEC_DRAFT_0_14_CANDIDATE.md
            CORE_SPEC_DRAFT_0_15_CANDIDATE.md
            CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
            HISTORICAL_PRE_ISOGRAPH_README.md
            .github/CODEOWNERS
            .github/REPOSITORY_SETTINGS.md
          )

          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "required authority/governance file missing or empty: $path" >&2
              exit 1
            }
          done

          grep -Fq '# IsoGraph' README.md
          grep -Fq '275b4d28224990a2b8fbdd7fa66cb071fb867e48' MIGRATION.md
          grep -Fq 'CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md' AGENTS.md
          grep -Fq 'surface syntax' CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
          grep -Fq 'structural-only candidate retrieval path' CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
          grep -Fq '* @iteathen' .github/CODEOWNERS

          # One-shot migration workflows must not return after migration.
          test ! -e .github/workflows/migrate-isograph.yml
          test ! -e .github/workflows/name-sweep.yml
          test ! -e .github/workflows/path-sweep.yml

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail

          # Markdown permits trailing spaces for hard line breaks in this repository.
          # Keep Git whitespace enforcement for all other changed files.
          mapfile -d '' changed < <(
            git diff-tree --no-commit-id --name-only -r -z --root HEAD
          )

          non_markdown=()
          for path in "${changed[@]}"; do
            case "$path" in
              *.md|*.mdx) ;;
              *) non_markdown+=("$path") ;;
            esac
          done

          if ((${#non_markdown[@]})); then
            git diff-tree --check --root -r HEAD -- "${non_markdown[@]}"
          fi

      - name: Verify frozen evidence remains present
        shell: bash
        run: |
          set -euo pipefail

          test -d experiments/001
          test -d experiments/002
          test -d experiments/003
          test -d experiments/004
          test -s experiments/004/EXTERNAL_REVIEW_GEMINI_001_DISPOSITION.md
          test -s experiments/004/RESULTS_004.md
