name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify repository authority surface
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            STATUS.md
            MIGRATION.md
            AGENTS.md
            CONTRIBUTING.md
            LICENSE
            NATIVE_FORMAT.md
            CORE_SPEC_DRAFT_0_13_CONSOLIDATED_CANDIDATE.md
            CORE_SPEC_DRAFT_0_14_CANDIDATE.md
            CORE_SPEC_DRAFT_0_15_CANDIDATE.md
            CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
            HISTORICAL_PRE_ISOGRAPH_README.md
            .github/CODEOWNERS
            .github/REPOSITORY_SETTINGS.md
          )

          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "required authority/governance file missing or empty: $path" >&2
              exit 1
            }
          done

          grep -Fq '# IsoGraph' README.md
          grep -Fq '275b4d28224990a2b8fbdd7fa66cb071fb867e48' MIGRATION.md
          grep -Fq 'CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md' AGENTS.md
          grep -Fq 'surface syntax' CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
          grep -Fq 'structural-only candidate retrieval path' CORE_SPEC_DRAFT_0_15_CONSOLIDATED_CANDIDATE.md
          grep -Fq '.isg' NATIVE_FORMAT.md
          grep -Fq '* @iteathen' .github/CODEOWNERS

          # One-shot migration workflows must not return after migration.
          test ! -e .github/workflows/migrate-isograph.yml
          test ! -e .github/workflows/name-sweep.yml
          test ! -e .github/workflows/path-sweep.yml

      - name: Verify current Experiment 004 qualification corpus
        shell: bash
        run: |
          set -euo pipefail

          required=(
            experiments/004/COLD_RUN_MANIFEST_004_V3.md
            experiments/004/RESULTS_004.md
            experiments/004/EXPERIMENT_004_DRAFT_0_15_CONSTRUCTION_AUDIT.md
            experiments/004/COLD_PHASE_A_PROMPT_004_DRAFT_0_15.md
            experiments/004/COLD_PHASE_B_REWRITE_PROMPT_004_DRAFT_0_15.md
            experiments/004/COLD_PHASE_C_PROMPT_004_DRAFT_0_15.md
            experiments/004/COLD_PHASE_C_NEGATIVE_INDEX_PROMPT_004_DRAFT_0_15.md
            experiments/004/COLD_Q004_09_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_10_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_16_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_17_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_18_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_19_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_20_STRUCTURE_ONLY_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_20_LABEL_ASSISTED_PROMPT_DRAFT_0_15.md
            experiments/004/COLD_Q004_17B_PROMPT.md
            experiments/004/Q004_17B_NATIVE_RECORDS_004.isg
            experiments/004/Q004_17B_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S01_PROMPT.md
            experiments/004/Q004_S01_LEGAL_REFERENCE_BINDING.isg
            experiments/004/Q004_S01_INVALID_EDGE_BINDING.isg
            experiments/004/Q004_S01_INVALID_DECLARATIVE_BINDING.isg
            experiments/004/Q004_S01_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S02_PROMPT.md
            experiments/004/Q004_S02_RULE_SPLICE.isg
            experiments/004/Q004_S02_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S03_PROMPT.md
            experiments/004/Q004_S03_VARIABLE_OWNERSHIP.isg
            experiments/004/Q004_S03_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S04_PROMPT.md
            experiments/004/Q004_S04_TWO_STAGE_RESIDUAL.isg
            experiments/004/Q004_S04_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S05_PROMPT.md
            experiments/004/Q004_S05_FACTOR_STAGE_INDEX.isg
            experiments/004/Q004_S05_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S06_PROMPT.md
            experiments/004/Q004_S06_PARSE_01.isg
            experiments/004/Q004_S06_PARSE_02.isg
            experiments/004/Q004_S06_PARSE_03.isg
            experiments/004/Q004_S06_PARSE_04.isg
            experiments/004/Q004_S06_PARSE_05.isg
            experiments/004/Q004_S06_PARSE_06.isg
            experiments/004/Q004_S06_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S07_PROMPT.md
            experiments/004/Q004_S07_NAC_INERT.isg
            experiments/004/Q004_S07_NAC_MATCHER.isg
            experiments/004/Q004_S07_NAC_FORBIDDEN.isg
            experiments/004/Q004_S07_ASSERTIONS_004.json
            experiments/004/COLD_Q004_S08_PROMPT.md
            experiments/004/Q004_S08_SERIALIZER_SCOPE.isg
            experiments/004/Q004_S08_ASSERTIONS_004.json
          )

          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "required Experiment 004 artifact missing or empty: $path" >&2
              exit 1
            }
          done

          scorer_json=(
            experiments/004/Q004_17B_ASSERTIONS_004.json
            experiments/004/Q004_S01_ASSERTIONS_004.json
            experiments/004/Q004_S02_ASSERTIONS_004.json
            experiments/004/Q004_S03_ASSERTIONS_004.json
            experiments/004/Q004_S04_ASSERTIONS_004.json
            experiments/004/Q004_S05_ASSERTIONS_004.json
            experiments/004/Q004_S06_ASSERTIONS_004.json
            experiments/004/Q004_S07_ASSERTIONS_004.json
            experiments/004/Q004_S08_ASSERTIONS_004.json
          )

          for path in "${scorer_json[@]}"; do
            jq -e . "$path" >/dev/null
          done

          grep -Fq 'all current prompt/fixture/scorer artifacts constructed and frozen' experiments/004/COLD_RUN_MANIFEST_004_V3.md
          grep -Fq 'Zero isolated current-authority runs have been accepted yet.' experiments/004/COLD_RUN_MANIFEST_004_V3.md
          grep -Fq 'first current-authority Draft 0.15 qualification checkpoint reached' experiments/004/RESULTS_004.md
          grep -Fq 'PASS:     15' experiments/004/RESULTS_004.md
          grep -Fq 'PARTIAL:   6' experiments/004/RESULTS_004.md
          grep -Fq 'FAIL:      0' experiments/004/RESULTS_004.md
          grep -Fq 'UNKNOWN:   0' experiments/004/RESULTS_004.md
          grep -Fq 'Experiment 004 qualification required for this checkpoint is complete.' experiments/004/RESULTS_004.md

      - name: Verify frozen Experiment 004 inputs were not rewritten
        shell: bash
        run: |
          set -euo pipefail

          # Consolidated-authority main checkpoint from which the current
          # qualification construction branch was created.
          base=5ca94c6e607f86f03920bf4206ed72e315466a87

          frozen=(
            experiments/004/COLD_PHASE_A_PROMPT_004.md
            experiments/004/COLD_PHASE_B_REWRITE_PROMPT_004.md
            experiments/004/COLD_PHASE_C_PROMPT_004.md
            experiments/004/COLD_PHASE_C_NEGATIVE_INDEX_PROMPT_004.md
            experiments/004/COLD_Q004_09_PROMPT.md
            experiments/004/COLD_Q004_10_PROMPT.md
            experiments/004/COLD_Q004_16_PROMPT.md
            experiments/004/COLD_Q004_17_PROMPT.md
            experiments/004/COLD_Q004_18_PROMPT.md
            experiments/004/COLD_Q004_19_PROMPT.md
            experiments/004/COLD_Q004_20_STRUCTURE_ONLY_PROMPT.md
            experiments/004/COLD_Q004_20_LABEL_ASSISTED_PROMPT.md
            experiments/004/COLD_RUN_MANIFEST_004.md
            experiments/004/COLD_RUN_MANIFEST_004_V2.md
            experiments/004/PHASE_A_CASES_004.axh
            experiments/004/PHASE_A_ASSERTIONS_004.json
            experiments/004/PHASE_B_REWRITE_CASES_004.axh
            experiments/004/PHASE_B_REWRITE_ASSERTIONS_004.json
            experiments/004/PHASE_C_COMPARISON_CASES_004.axh
            experiments/004/PHASE_C_ASSERTIONS_004.json
            experiments/004/PHASE_C_NEGATIVE_INDEX_CASES_004.axh
            experiments/004/PHASE_C_NEGATIVE_INDEX_ASSERTIONS_004.json
            experiments/004/Q004_09_DECOMPOSITION_CHEAT_004.axh
            experiments/004/Q004_09_ASSERTIONS_004.json
            experiments/004/Q004_10_EXTRACTION_FREEZE_004.axh
            experiments/004/Q004_10_ASSERTIONS_004.json
            experiments/004/Q004_16_CLASS_NONVACUITY_004.axh
            experiments/004/Q004_16_ASSERTIONS_004.json
            experiments/004/Q004_17_NATIVE_RECORDS_004.axh
            experiments/004/Q004_17_ASSERTIONS_004.json
            experiments/004/Q004_18_SOURCE_AMBIGUITY_004.axh
            experiments/004/Q004_18_ASSERTIONS_004.json
            experiments/004/Q004_19_NOVEL_CLASS_004.axh
            experiments/004/Q004_19_ASSERTIONS_004.json
            experiments/004/Q004_20_STRUCTURE_CORPUS_004.axh
            experiments/004/Q004_20_LABEL_ASSIST_004.axh
            experiments/004/Q004_20_ASSERTIONS_004.json
          )

          for path in "${frozen[@]}"; do
            before=$(git rev-parse "$base:$path")
            now=$(git rev-parse "HEAD:$path")
            test "$before" = "$now" || {
              echo "frozen historical Experiment 004 artifact changed: $path" >&2
              exit 1
            }
          done

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail

          # Markdown permits trailing spaces for hard line breaks in this repository.
          # Keep Git whitespace enforcement for all other changed files.
          mapfile -d '' changed < <(
            git diff-tree --no-commit-id --name-only -r -z --root HEAD
          )

          non_markdown=()
          for path in "${changed[@]}"; do
            case "$path" in
              *.md|*.mdx) ;;
              *) non_markdown+=("$path") ;;
            esac
          done

          if ((${#non_markdown[@]})); then
            git diff-tree --check --root -r HEAD -- "${non_markdown[@]}"
          fi

      - name: Forbid GitHub Actions storage
        run: node tools/check-no-github-actions-storage.mjs

      - name: Verify frozen evidence remains present
        shell: bash
        run: |
          set -euo pipefail

          test -d experiments/001
          test -d experiments/002
          test -d experiments/003
          test -d experiments/004
          test -s experiments/004/EXTERNAL_REVIEW_GEMINI_001_DISPOSITION.md
          test -s experiments/004/RESULTS_004.md
