name: Experiment 062 L G0 frozen L04 p12 commuting-C triality 48 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l04-commuting-C-48-finite-model-0-1.mjs'
      - 'experiments/062/tools/verify-l-g0-l04-original-p12-commuting-C-48-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-l04-original-p12-commuting-C-48-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L04-original-p12-commuting-C48:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l04-commuting-C-48-finite-model-0-1.mjs
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-p12-commuting-C-48-0-1.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-p12-commuting-C-48-0-1.mjs
