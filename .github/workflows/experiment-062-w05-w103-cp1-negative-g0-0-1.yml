name: Experiment 062 W05 W103 printed Hodge CP1 negative G0 0.1
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/W05_G0_W103_SOURCE_FIRST_CONJUNCTION_REVERSE_0_1.json
      - experiments/062/W05_G0_W103_CP1_PRINTED_FILTRATION_FALSIFIER_0_1.json
      - experiments/062/W_CURRENT_STAGE_GATE_0_72.json
      - experiments/062/tools/verify-w05-w103-cp1-printed-hodge-g0-0-1.mjs
      - .github/workflows/experiment-062-w05-w103-cp1-negative-g0-0-1.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  w05-w103-hodge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/verify-w05-w103-cp1-printed-hodge-g0-0-1.mjs
