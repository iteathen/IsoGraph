name: Experiment 030 deterministic harness

on:
  push:
    branches:
      - experiment/030-core-0.19-mutation-regression
    paths:
      - experiments/030/HARNESS.request

permissions:
  contents: read

concurrency:
  group: experiment-030-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify Experiment 030 deterministic harness
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/030/tools/test-score-exp030.mjs
          node experiments/030/tools/test-score-exp030.mjs
