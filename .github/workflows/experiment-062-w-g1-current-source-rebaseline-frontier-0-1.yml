name: Experiment 062 W G1 frozen 151-source rebaseline frontier 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_SOURCE_REBASELINE_FRONTIER_0_1.json'
      - 'experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-current-source-rebaseline-frontier-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
      - name: Frozen 151 W source bodies versus 84 historical occurrence bodies and 18 hostiles
        run: node experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
      - name: Recheck original 151-source G0 conservations, freeze and stage tuple
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
          node experiments/062/tools/verify-w-g0-current-qualified-stage-0-1.cjs
