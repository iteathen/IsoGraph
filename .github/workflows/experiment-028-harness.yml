name: Experiment 028 deterministic harness

on:
  push:
    branches:
      - experiment/028-dp07-derived-views
    paths:
      - experiments/028/HARNESS.request

permissions:
  contents: read

concurrency:
  group: experiment-028-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify Experiment 028 deterministic harness
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/028/tools/test-score-exp028.mjs
          node --check experiments/028/tools/test-runner-exp028.mjs
          node experiments/028/tools/test-score-exp028.mjs
          node experiments/028/tools/test-runner-exp028.mjs
