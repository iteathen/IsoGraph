name: Experiment 062 W G3 definability verify

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/W_G3_CORE_DEFINABILITY_0_1.json
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/W_EXTRACTION_RECONCILED_0_18.json
      - experiments/062/G1_OWNER_COLD_AUDIT_WAIVER_0_1.json
      - experiments/062/tools/generate-w-g3-core-definability-0-1.mjs
      - experiments/062/tools/verify-w-g3-core-definability-0-1.mjs
      - .github/workflows/experiment-062-w-g3-definability.yml
  pull_request:
    paths:
      - experiments/062/W_G3_CORE_DEFINABILITY_0_1.json
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/W_EXTRACTION_RECONCILED_0_18.json
      - experiments/062/G1_OWNER_COLD_AUDIT_WAIVER_0_1.json
      - experiments/062/tools/generate-w-g3-core-definability-0-1.mjs
      - experiments/062/tools/verify-w-g3-core-definability-0-1.mjs
      - .github/workflows/experiment-062-w-g3-definability.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify W G3 conservative pass
        run: node experiments/062/tools/verify-w-g3-core-definability-0-1.mjs
