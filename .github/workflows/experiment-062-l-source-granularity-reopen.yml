name: Experiment 062 L source granularity reopen audit

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G1_SOURCE_GRANULARITY_REOPEN_AUDIT_0_1.json'
      - 'experiments/062/tools/verify-l-g1-source-granularity-reopen-audit-0-1.mjs'
      - '.github/workflows/experiment-062-l-source-granularity-reopen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L130 source granularity reopen audit
        run: node experiments/062/tools/verify-l-g1-source-granularity-reopen-audit-0-1.mjs
