name: "Experiment 062 W01 independent original 48-page source-first G0 0.1"
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - "experiments/062/W01_G0_INDEPENDENT_48PAGE_SOURCE_FIRST_PDF_AUDIT_0_1.json"
      - "experiments/062/tools/verify-w01-independent-48page-original-pdf-g0-0-1.cjs"
      - ".github/workflows/experiment-062-w01-independent-48page-sourcefirst-0-1.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  w01_original_48page_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Check and verify original W01 48-page PDF source-first G0 with adversarial cases
        run: |
          node --check experiments/062/tools/verify-w01-independent-48page-original-pdf-g0-0-1.cjs
          node experiments/062/tools/verify-w01-independent-48page-original-pdf-g0-0-1.cjs
