name: Experiment 062 G1 owner waiver guard

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/G1_OWNER_COLD_AUDIT_WAIVER_0_1.json
      - experiments/062/W_EXTRACTION_RECONCILED_0_18.json
      - experiments/062/L_EXTRACTION_RECONCILED_0_25.json
      - experiments/062/W_G1_COMPLETE_REPEAT_AUDIT_0_1.json
      - experiments/062/L_G1_COMPLETE_REPEAT_AUDIT_0_1.json
      - experiments/062/tools/verify-g1-owner-cold-audit-waiver-0-1.mjs
      - .github/workflows/experiment-062-g1-owner-waiver.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify one-time G1 cold-audit waiver
        run: node experiments/062/tools/verify-g1-owner-cold-audit-waiver-0-1.mjs
