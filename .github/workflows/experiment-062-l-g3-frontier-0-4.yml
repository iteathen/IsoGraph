name: Experiment 062 verify L G3 frontier 0.4

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G3_DEFINITION_STATUS_FRONTIER_0_4.json'
      - 'experiments/062/L_G3_CORE_DEFINABILITY_0_4.json'
      - 'experiments/062/tools/apply-l-g3-definition-status-frontier-0-4.mjs'
      - 'experiments/062/tools/verify-l-g3-definition-status-frontier-0-4.mjs'
      - '.github/workflows/experiment-062-l-g3-frontier-0-4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L G3 definition-status frontier
        run: node experiments/062/tools/verify-l-g3-definition-status-frontier-0-4.mjs
