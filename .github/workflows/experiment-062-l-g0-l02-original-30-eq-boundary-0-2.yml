name: Experiment 062 L G0 L02 frozen original thirty equations corrected adversarial 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L02_ALL30_FIRST_ADVERSARIAL_VERIFIER_FAILURE_0_1.json'
      - 'experiments/062/tools/verify-l-g0-l02-original-30-eq-boundary-0-2.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_95.json'
      - 'research/woit-lisi-isomorph/lisi/LISI_L02_ALL_30_ORIGINAL_NUMBERED_EQUATION_EVIDENCE_BOUNDARY_G0_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l02-original-30-eq-boundary-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L02-original-Eq30-corrected-hostiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node experiments/062/tools/verify-l-g0-l02-original-30-eq-boundary-0-2.mjs
