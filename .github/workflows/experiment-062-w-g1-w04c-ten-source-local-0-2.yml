      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Syntax and exact immutable failed baseline evidence
        run: |
          node --check experiments/062/tools/verify-w-g1-w04c-ten-source-first-0-2.cjs
          node -e "const a=require('./experiments/062/W_G1_W04C_V01_FAILED_NODE_BASELINE_0_1.json'); if(a.positive_baseline!==false || a.hostile_mutations_executed!==0 || a.workflow.conclusion!=='failure')process.exit(1)"
      - name: Verify exact W04c source-local positive and 23 hostile cases
        run: node experiments/062/tools/verify-w-g1-w04c-ten-source-first-0-2.cjs
      - name: Verify prior exact W39 and current G0 frozen source guard
        run: |
          node experiments/062/tools/verify-w-g1-current-39-body-stage-0-1.cjs
