name: Experiment 062 W G1 original-first W01 section4.3 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_W01_S43_SOURCE_FIRST_0_1.json'
      - 'experiments/062/tools/verify-w-g1-w01-s43-0-2.cjs'
      - 'experiments/062/tools/cold-w01-s43-original-source-0-1.py'
      - '.github/workflows/experiment-062-w-g1-w01-s43-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: |
          node --check experiments/062/tools/verify-w-g1-w01-s43-0-2.cjs
          python3 -m py_compile experiments/062/tools/cold-w01-s43-original-source-0-1.py
      - name: Direct original Woit v2 section 4.3 cold reread 22 original author anchors
        run: python3 -u experiments/062/tools/cold-w01-s43-original-source-0-1.py
      - name: Exact frozen-G0 typed source role reconstruction and 30 mutation controls
        run: node experiments/062/tools/verify-w-g1-w01-s43-0-2.cjs
      - name: Conserve nine reviewed G1 bodies and original qualified G0
        run: |
          node experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
