name: Experiment 062 W G1 W04b six original author source local 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_W04B_SIX_UNREVIEWED_SOURCE_FIRST_0_2.json'
      - 'experiments/062/tools/cold-w04b-original-author-g1-0-1.py'
      - 'experiments/062/tools/verify-w-g1-w04b-six-original-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-w04b-six-original-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Check frozen source verifier syntax
        run: |
          python3 -m py_compile experiments/062/tools/cold-w04b-original-author-g1-0-1.py
          node --check experiments/062/tools/verify-w-g1-w04b-six-original-0-1.cjs
      - name: Independently fetch W04b authored source twice; check 19 cold source anchors
        run: python3 -u experiments/062/tools/cold-w04b-original-author-g1-0-1.py
      - name: Check W04b six source bodies against original and 30 hostile mutations
        run: node experiments/062/tools/verify-w-g1-w04b-six-original-0-1.cjs
      - name: Verify prior exact 33-body source-qualified baseline and frozen G0
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
