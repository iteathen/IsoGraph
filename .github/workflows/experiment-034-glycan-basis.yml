name: Experiment 034 glycan minimal basis and star oracle

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/034/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-034-glycan-basis
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Execute basis and star-product checks
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/034/tools/run-exp034.mjs
          rm -rf out/exp034
          node experiments/034/tools/run-exp034.mjs

      - name: Persist Experiment 034 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/034/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in BASIS_CONTROLS.json STAR_CONTROLS.json BENCHMARK.json RESULT.json; do
            [ -f "out/exp034/$f" ] && cp "out/exp034/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 034 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce experiment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp034/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp034/RESULT.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(r.disposition!=='PASS') process.exit(1);
          if(r.basis_controls.basis_mismatches!==0) process.exit(1);
          if(r.basis_controls.qo_guard_failures!==0) process.exit(1);
          if(r.star_controls.mismatches!==0) process.exit(1);
          if(r.benchmark.total_qo_guard_issues!==0) process.exit(1);
          if(r.benchmark.total_bad_basis_words!==0) process.exit(1);
          NODE
