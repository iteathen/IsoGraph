name: Experiment 048 Core 0.20 qualification

on:
  push:
    branches:
      - qualification/core020-dp08-20260928
    paths:
      - experiments/048/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-048-core-0-20
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3-flash-preview
  GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.1-pro-preview,gemini-3.1-flash-lite,gemini-pro-latest

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Deterministic Core 0.20 preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/048/tools/run-exp048-cold.mjs
          node --check experiments/048/tools/score-exp048.mjs
          node --check experiments/048/tools/test-score-exp048.mjs
          node --check experiments/048/tools/test-runner-exp048.mjs
          node experiments/048/tools/test-score-exp048.mjs
          node experiments/048/tools/test-runner-exp048.mjs

          rm -rf out/exp048
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/048/tools/run-exp048-cold.mjs

          node - <<'NODE'
          const fs=require('fs');
          const dry=JSON.parse(fs.readFileSync('out/exp048/DRY_RUN.json','utf8'));
          if(dry.case_count!==18) throw new Error('case count mismatch');
          if(!/^[0-9a-f]{64}$/.test(dry.core_0_20_sha256)) throw new Error('Core 0.20 SHA-256 missing');
          const paths=dry.input_manifest.map(x=>x.path);
          const expected=[
            'CORE_SPEC_DRAFT_0_17_CONSOLIDATED_QUALIFIED.md',
            'CORE_SPEC_DRAFT_0_18_OBSERVATION_FIRST_CANDIDATE.md',
            'CORE_SPEC_DRAFT_0_19_IMPLICIT_ASSERTIONS_CANDIDATE.md',
            'extensions/qu/QUANTIFIABLE_UNKNOWN_SPEC_0_1_CANDIDATE.md',
            'CORE_SPEC_DRAFT_0_20_PRIMITIVE_LOGIC_CLOSURE_CANDIDATE.md',
            'experiments/048/BASELINE_AUTHORITY.md',
            'experiments/048/CORE_0_20_CASES.md',
            'experiments/048/COLD_PROMPT.md'
          ];
          if(JSON.stringify(paths)!==JSON.stringify(expected)) throw new Error('unexpected cold packet manifest');
          console.log(JSON.stringify({
            packet_sha256:dry.packet_sha256,
            core_0_20_sha256:dry.core_0_20_sha256,
            case_count:dry.case_count
          },null,2));
          NODE

      - name: Execute isolated Core 0.20 decoder
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/048/tools/run-exp048-cold.mjs

      - name: Verify packet identity and hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp048/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp048/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/048/tools/score-exp048.mjs

      - name: Persist Experiment 048 evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/048/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp048/$f" ] && cp "out/exp048/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 048 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin qualification/core020-dp08-20260928
            git rebase origin/qualification/core020-dp08-20260928
            git push origin HEAD:qualification/core020-dp08-20260928
          fi

      - name: Enforce Core 0.20 qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = "success"
          test "$SCORE_OUTCOME" = "success"
          test -f out/exp048/SCORE.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp048/SCORE.json','utf8'));console.log(JSON.stringify({disposition:s.disposition,core:s.core_0_20,guards:s.guards},null,2));if(s.disposition!=='QUALIFIES')process.exit(1)"
