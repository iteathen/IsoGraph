name: Experiment 062 L127 corrected reconstruction routing

on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L127_CURRENT_RECONSTRUCTION_ROUTING_0_2.json'
      - 'experiments/062/tools/verify-l127-current-reconstruction-routing-0-2.mjs'
      - '.github/workflows/experiment-062-l127-current-reconstruction-routing-0-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/verify-l127-current-reconstruction-routing-0-2.mjs
