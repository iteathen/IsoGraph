name: Experiment 062 L131 source-fidelity replay
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L131_SOURCE_FIDELITY_DEFECT_0_1.json'
      - 'experiments/062/L131_G1_SOURCE_GRANULARITY_REOPEN_AUDIT_0_2.json'
      - 'experiments/062/L131_G1_SOURCE_INCIDENCE_0_2.json'
      - 'experiments/062/L131_G2_NEUTRAL_SUBGRAPH_0_2.json'
      - 'experiments/062/L131_G3_CORE_DEFINABILITY_0_2.json'
      - 'experiments/062/tools/verify-l131-source-fidelity-replay-0-1.mjs'
      - '.github/workflows/experiment-062-l131-source-fidelity-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/verify-l131-source-fidelity-replay-0-1.mjs
