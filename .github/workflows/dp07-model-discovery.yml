name: DP07 Gemini model inventory

on:
  push:
    branches:
      - experiment/dp07-three-positive-controls-v1
    paths:
      - research/project-discovery/2026-09-25-dp07-three-positive-controls/MODEL_DISCOVERY.request

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: List generateContent-capable Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          node <<'NODE'
          const key=process.env.GEMINI_API_KEY;
          let pageToken='';
          const models=[];
          do {
            const u=new URL('https://generativelanguage.googleapis.com/v1beta/models');
            u.searchParams.set('pageSize','1000');
            if(pageToken) u.searchParams.set('pageToken',pageToken);
            const r=await fetch(u,{headers:{'x-goog-api-key':key}});
            const txt=await r.text();
            if(!r.ok){console.error(txt);process.exit(1);}
            const data=JSON.parse(txt);
            for(const m of data.models||[]){
              if((m.supportedGenerationMethods||[]).includes('generateContent')){
                models.push({
                  name:(m.name||'').replace(/^models\//,''),
                  displayName:m.displayName,
                  inputTokenLimit:m.inputTokenLimit,
                  outputTokenLimit:m.outputTokenLimit,
                  methods:m.supportedGenerationMethods
                });
              }
            }
            pageToken=data.nextPageToken||'';
          } while(pageToken);
          models.sort((a,b)=>a.name.localeCompare(b.name));
          console.log(JSON.stringify({count:models.length,models},null,2));
          NODE

      - name: Probe preferred text reasoners
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const key=process.env.GEMINI_API_KEY;
          const candidates=[
            'gemini-2.5-pro',
            'gemini-3-flash-preview',
            'gemini-flash-latest',
            'gemini-pro-latest',
            'gemini-3.1-pro-preview',
            'gemini-3.8-flash'
          ];
          const results=[];
          let selected=null;
          for(const model of candidates){
            const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{
              method:'POST',
              headers:{'Content-Type':'application/json','x-goog-api-key':key},
              body:JSON.stringify({
                contents:[{role:'user',parts:[{text:'Return exactly OK.'}]}],
                generationConfig:{candidateCount:1,maxOutputTokens:32,temperature:0}
              })
            });
            const txt=await r.text();
            const item={model,status:r.status,ok:r.ok};
            if(r.ok){
              try{
                const data=JSON.parse(txt);
                item.response=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim().slice(0,80);
              }catch{item.response='UNPARSEABLE_SUCCESS_BODY';}
              results.push(item);
              selected=model;
              break;
            }
            item.body_prefix=txt.slice(0,300);
            results.push(item);
          }
          console.log('DP07_PREFERRED_PROBE='+JSON.stringify({selected,results}));
          if(!selected) process.exitCode=2;
          NODE
