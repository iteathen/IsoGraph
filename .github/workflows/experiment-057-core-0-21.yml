name: Experiment 057 Core 0.21 qualification

on:
  push:
    branches:
      - qualification/core021-rendering-conservation-20260929
    paths:
      - experiments/057/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-057-core021
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.1-flash-lite
  GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-pro-latest,gemini-3.1-pro-preview

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Deterministic Core 0.21 preflight
        run: |
          set -euo pipefail
          node --check tools/core021/check-core021-ledger.mjs
          node --check tools/core021/test-core021-ledger.mjs
          node --check experiments/057/tools/run-exp057-cold.mjs
          node --check experiments/057/tools/score-exp057.mjs
          node tools/core021/test-core021-ledger.mjs
          rm -rf out/exp057
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/057/tools/run-exp057-cold.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('out/exp057/DRY_RUN.json','utf8'));
          if(d.case_count!==26) throw new Error('case count mismatch');
          if(!/^[0-9a-f]{64}$/.test(d.core_0_21_sha256)) throw new Error('Core 0.21 SHA missing');
          const paths=d.input_manifest.map(x=>x.path);
          if(paths.some(p=>p.includes('/hidden/')||p.includes('score-exp057'))) throw new Error('hidden input leaked');
          console.log(JSON.stringify({packet_sha256:d.packet_sha256,core_0_21_sha256:d.core_0_21_sha256,case_count:d.case_count},null,2));
          NODE
      - name: Execute isolated Core 0.21 reasoner
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/057/tools/run-exp057-cold.mjs
      - name: Hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        run: node experiments/057/tools/score-exp057.mjs
      - name: Persist Experiment 057 evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          E="experiments/057/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp057/$f" ] && cp "out/exp057/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 057 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin qualification/core021-rendering-conservation-20260929
            git rebase origin/qualification/core021-rendering-conservation-20260929
            git push origin HEAD:qualification/core021-rendering-conservation-20260929
          fi
      - name: Enforce Core 0.21 qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = "success"
          test "$SCORE_OUTCOME" = "success"
          node -e "const s=require('./out/exp057/SCORE.json');if(s.disposition!=='QUALIFIES')process.exit(1)"
