name: Experiment 004 Gemini Independent Verifier V2

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/experiment-004-gemini-verifier-v2.yml

permissions:
  contents: write

concurrency:
  group: experiment-004-gemini-verifier
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-3.5-flash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: test -n "${GEMINI_API_KEY:-}"

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: [RUN-S07, RUN-S04, RUN-S05, RUN-S08, RUN-B, RUN-C1, RUN-C2, RUN-D09, RUN-D10, RUN-D16, RUN-D18, RUN-D19, RUN-D20S, RUN-D20L]
    steps:
      - name: Check out evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Fetch Claude evidence branch
        shell: bash
        run: git fetch origin experiment/004-cold-results-claude:refs/remotes/origin/experiment/004-cold-results-claude

      - name: Execute scorer-blind structural verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: ${{ matrix.run }}
        run: node experiments/004/tools/run-gemini-verifier.mjs

      - name: Freeze verifier artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isograph-exp004-${{ matrix.run }}-verifier-v2
          path: out/
          if-no-files-found: error
          retention-days: 30

  archive:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest results branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Download verifier artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: isograph-exp004-*-verifier-v2
          path: verifier-downloads
          merge-multiple: true

      - name: Archive verifier outputs
        shell: bash
        run: |
          set -euo pipefail
          dest=experiments/004/cold-results/gemini/verifier
          mkdir -p "$dest"
          found=0
          for report in verifier-downloads/*_VERIFIER_REPORT.txt; do
            [ -e "$report" ] || continue
            base="$(basename "$report" _VERIFIER_REPORT.txt)"
            mkdir -p "$dest/$base"
            cp "$report" "$dest/$base/VERIFIER_REPORT.txt"
            cp "verifier-downloads/${base}_VERIFIER_METADATA.json" "$dest/$base/VERIFIER_METADATA.json"
            found=$((found+1))
          done
          echo "V2 archived $found verifier reports."
          test "$found" -gt 0
          printf '# Experiment 004 — scorer-blind verifier archive\n\nLatest verifier workflow run: `%s`\n\nV2 successful reports: **%s / 14**. Existing V1 reports for owner/manual runs are retained.\n\nVerifier packets exclude hidden assertions, scoring reports, qualification ledgers, expected answers, and prior verifier outputs.\n' "$GITHUB_RUN_ID" "$found" > "$dest/MANIFEST.md"

      - name: Commit verifier archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "iteathen"
          git config user.email "josh.oshiro@gmail.com"
          git add experiments/004/cold-results/gemini/verifier
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'experiment: archive scorer-blind Experiment 004 verifier evidence'
          git push origin HEAD:experiment/004-gemini-results
