name: IsoGraph name sweep

on:
  push:
    branches: [chore/isograph-name-sweep]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sweep:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'chore/isograph-name-sweep' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out rename branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/isograph-name-sweep
          fetch-depth: 0

      - name: Replace project-name tokens and filenames
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r -d '' file; do
            perl -0pi -e 's/AxiomeSH/IsoGraph/g; s/AXIOMESH/ISOGRAPH/g; s/Axiomesh/IsoGraph/g; s/IsoMesh/IsoGraph/g; s/ISOMESH/ISOGRAPH/g; s/isomesh/isograph/g; s/axiomesh/isograph/g' "$file"
            perl -0pi -e 's#experiment/isograph-native-reconstruction#experiment/axiomesh-native-reconstruction#g; s#export/isograph-gemini-review#export/axiomesh-gemini-review#g; s#research/isograph/#research/axiomesh/#g; s#research/isograph\b#research/axiomesh#g' "$file"
          done < <(git grep -Ilz -i -E 'axiomesh|isomesh' || true)

          while IFS= read -r old; do
            [ -n "$old" ] || continue
            new="${old//AXIOMESH/ISOGRAPH}"
            new="${new//ISOMESH/ISOGRAPH}"
            if [ "$old" != "$new" ]; then
              git mv "$old" "$new"
            fi
          done < <(git ls-files | grep -E 'AXIOMESH|ISOMESH' || true)

          if [ -e HISTORICAL_ISOGRAPH_README.md ]; then
            git mv HISTORICAL_ISOGRAPH_README.md HISTORICAL_PRE_ISOGRAPH_README.md
            git grep -IlZ 'HISTORICAL_ISOGRAPH_README.md' | xargs -0 -r perl -0pi -e 's/HISTORICAL_ISOGRAPH_README\.md/HISTORICAL_PRE_ISOGRAPH_README.md/g'
          fi

          rm -f .github/workflows/name-sweep.yml

          git add -A
          if git diff --cached --quiet; then
            echo "No rename changes found"
            exit 0
          fi

          echo 'Remaining legacy-name tokens after sweep:'
          git grep -n -i -E 'axiomesh|isomesh' -- . || true

          git commit -m "docs: rename AxiomeSH project references to IsoGraph"
          git push origin HEAD:chore/isograph-name-sweep
