name: One-shot mutable document math validation

on:
  push:
    branches:
      - fix/document-math-rendering-20260929
    paths:
      - maintenance/DOC_MATH_VALIDATION_2026-09-29.request

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Install isolated KaTeX validator
        run: npm install --prefix /tmp/isograph-docmath katex@0.16.22 --no-save --ignore-scripts
      - name: Validate mutable-document math
        env:
          NODE_PATH: /tmp/isograph-docmath/node_modules
        run: node tools/validate-doc-math-katex.cjs

      - name: Persist validation report
        if: always()
        run: |
          set -euo pipefail
          test -s out/doc-math-katex-report.json || exit 0
          cp out/doc-math-katex-report.json maintenance/DOC_MATH_VALIDATION_REPORT_2026-09-29.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/DOC_MATH_VALIDATION_REPORT_2026-09-29.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: record mutable document math validation"
            git fetch origin fix/document-math-rendering-20260929
            git rebase origin/fix/document-math-rendering-20260929
            git push origin HEAD:fix/document-math-rendering-20260929
          fi
