name: Experiment 004 Gemini Independent Verifier

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/experiment-004-gemini-verifier.yml

permissions:
  contents: read

concurrency:
  group: experiment-004-gemini-verifier
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.5-flash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Gemini key and verifier model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY unavailable"; exit 1; }
          node --input-type=module <<'NODE'
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${process.env.GEMINI_MODEL}:generateContent`, {
            method:'POST',
            headers:{'Content-Type':'application/json','x-goog-api-key':process.env.GEMINI_API_KEY},
            body:JSON.stringify({contents:[{role:'user',parts:[{text:'Reply with ISOGRAPH_VERIFIER_OK.'}]}],generationConfig:{maxOutputTokens:256,thinkingConfig:{thinkingLevel:'MINIMAL'}}})
          });
          const body=await res.text();
          if (!res.ok) { console.error(`HTTP ${res.status}: ${body.slice(0,2000)}`); process.exit(1); }
          console.log(`Gemini verifier preflight accepted: ${process.env.GEMINI_MODEL}`);
          NODE

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [RUN-A, RUN-S01, RUN-S02, RUN-S03, RUN-S06, RUN-S07, RUN-S04, RUN-S05, RUN-S08, RUN-B, RUN-C1, RUN-C2, RUN-D09, RUN-D10, RUN-D16, RUN-D18, RUN-D19, RUN-D20S, RUN-D20L]
    steps:
      - name: Check out evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Fetch Claude evidence branch
        shell: bash
        run: git fetch origin experiment/004-cold-results-claude:refs/remotes/origin/experiment/004-cold-results-claude

      - name: Execute scorer-blind structural verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: ${{ matrix.run }}
        run: node experiments/004/tools/run-gemini-verifier.mjs

      - name: Emit verifier evidence to log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for p in out/*_VERIFIER_REPORT.txt out/*_VERIFIER_METADATA.json; do
            [ -f "$p" ] || continue
            found=1
            echo "===== BEGIN $(basename "$p") ====="
            cat "$p"
            echo "===== END $(basename "$p") ====="
          done
          echo "Evidence file hashes:"
          find out -maxdepth 2 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum
          test "$found" -eq 1
