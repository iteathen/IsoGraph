name: Experiment 062 L G1 source-local fixed-point verify

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - "experiments/062/L_EXTRACTION_RECONCILED_0_25.json"
      - "experiments/062/L_G1_COMPLETE_REPEAT_AUDIT_0_1.json"
      - "experiments/062/L_G1_SOURCE_LOCAL_ADJUDICATION_0_25.json"
      - "experiments/062/tools/verify-l-extraction-reconciled-0-25.mjs"
      - "experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs"
      - ".github/workflows/experiment-062-l-g1-source-local-fixed-point.yml"
  pull_request:
    paths:
      - "experiments/062/L_EXTRACTION_RECONCILED_0_25.json"
      - "experiments/062/L_G1_COMPLETE_REPEAT_AUDIT_0_1.json"
      - "experiments/062/L_G1_SOURCE_LOCAL_ADJUDICATION_0_25.json"
      - "experiments/062/tools/verify-l-extraction-reconciled-0-25.mjs"
      - "experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs"
      - ".github/workflows/experiment-062-l-g1-source-local-fixed-point.yml"

permissions:
  contents: read

jobs:
  verify-l-g1-source-local-fixed-point:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Verify L 0.25 and source-local fixed-point record
        run: node experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs
