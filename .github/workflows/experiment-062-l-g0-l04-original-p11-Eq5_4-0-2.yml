name: Experiment 062 L G0 original L04 p11 Eq5.4 source corrected 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_ORIGINAL_P11_EQ5_4_OPERATOR_WEIGHT_AND_T2_SOURCE_G0_0_2.json'
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_SOURCE_FIRST_REVERSE_COVERAGE_0_16.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_SEMANTIC_CENSUS_0_83.json'
      - 'research/woit-lisi-isomorph/lisi/L_G0_SIX_ORIGINAL_FINITE_SOURCE_FIRST_CONVERGENCE_0_37.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_TRAVERSAL_LEDGER_0_54.json'
      - 'experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-2.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_150.json'
      - '.github/workflows/experiment-062-l-g0-l04-original-p11-Eq5_4-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-p11-Eq5_4-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-2.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-p11-Eq5_4-source-0-2.mjs
