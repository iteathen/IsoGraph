name: MIPLIB semantic transposition 0.1

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/miplib-structural-presolve-20261006
    paths:
      - .github/workflows/experiment-miplib-semantic-transposition.yml
      - research/miplib-structural-presolve/SEMANTIC_TRANSPOSITION_0_1.md
      - research/miplib-structural-presolve/tools/run-semantic-transposition-0.1.py

permissions:
  contents: write

concurrency:
  group: miplib-semantic-transposition-0.1
  cancel-in-progress: false

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install frozen tools
        run: python3 -m pip install --disable-pip-version-check highspy==1.15.1 z3-solver==5.1.0.0
      - name: Execute semantic transposition prototype
        id: experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf out/miplib-semantic-transposition-0.1
          python3 -m py_compile research/miplib-structural-presolve/tools/run-semantic-transposition-0.1.py
          python3 research/miplib-structural-presolve/tools/run-semantic-transposition-0.1.py
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          E="research/miplib-structural-presolve/evidence/semantic-transposition-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in RESULT.json SUMMARY.md; do
            [ -f "out/miplib-semantic-transposition-0.1/$f" ] && cp "out/miplib-semantic-transposition-0.1/$f" "$E/$f"
          done
          printf '%s\n' "{\"workflow_run_id\":\"$GITHUB_RUN_ID\",\"workflow_attempt\":\"$GITHUB_RUN_ATTEMPT\",\"source_sha\":\"$GITHUB_SHA\",\"profile\":\"semantic-transposition-0.1\"}" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: semantic transposition ${GITHUB_RUN_ID}"
            for i in 1 2 3; do
              git fetch origin experiment/miplib-structural-presolve-20261006
              git rebase origin/experiment/miplib-structural-presolve-20261006
              if git push origin HEAD:experiment/miplib-structural-presolve-20261006; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Enforce
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = "success"
          test -f out/miplib-semantic-transposition-0.1/RESULT.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/miplib-semantic-transposition-0.1/RESULT.json"))
          print(json.dumps({"disposition":r["disposition"],"semantic_only_total":r["semantic_only_total"],"errors":r["errors"]},indent=2))
          if r["disposition"]!="PASS": raise SystemExit(1)
          PY
