name: Experiment 052 current-stack integration

on:
  push:
    branches: [qualification/core020-dp08-20260928]
    paths: [experiments/052/RUN.request]

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3-flash-preview
  GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.1-pro-preview,gemini-3.1-flash-lite,gemini-pro-latest

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Deterministic full-stack preflight
        run: |
          set -euo pipefail
          node experiments/052/tools/test-schema-exp052.mjs
          node experiments/052/tools/test-score-exp052.mjs
          node experiments/052/tools/test-runner-exp052.mjs
          rm -rf out/exp052
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/052/tools/run-exp052-cold.mjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('out/exp052/DRY_RUN.json','utf8'));
          if(d.case_count!==16)throw new Error('case count');
          for(const [name,hash] of Object.entries(d.module_sha256)){
            if(!/^[0-9a-f]{64}$/.test(hash))throw new Error('bad module hash '+name);
          }
          console.log(JSON.stringify({packet_sha256:d.packet_sha256,module_sha256:d.module_sha256,case_count:d.case_count},null,2));
          NODE
      - name: Execute isolated integrated-stack decoder
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/052/tools/run-exp052-cold.mjs
      - name: Verify packet identity and hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp052/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp052/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/052/tools/score-exp052.mjs
      - name: Persist Experiment 052 evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          E="experiments/052/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp052/$f" ] && cp "out/exp052/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 052 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin qualification/core020-dp08-20260928
            git rebase origin/qualification/core020-dp08-20260928
            git push origin HEAD:qualification/core020-dp08-20260928
          fi
      - name: Enforce integrated-stack qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = success
          test "$SCORE_OUTCOME" = success
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp052/SCORE.json','utf8'));console.log(JSON.stringify({disposition:s.disposition,integration:s.integration,guards:s.guards},null,2));if(s.disposition!=='QUALIFIES')process.exit(1)"
