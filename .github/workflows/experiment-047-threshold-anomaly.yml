name: Experiment 047 threshold anomaly verifier

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/047/VERIFY.request

permissions:
  contents: write

concurrency:
  group: experiment-047-threshold-anomaly
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact verifier revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Run independent Node threshold verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/047/tools/verify-threshold-anomaly.mjs
          rm -rf out/exp047-anomaly
          node experiments/047/tools/verify-threshold-anomaly.mjs

      - name: Persist anomaly evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/047/anomaly-evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -f out/exp047-anomaly/RESULT.json ] && cp out/exp047-anomaly/RESULT.json "$E/RESULT.json"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","implementation_language":"Node.js"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 047 threshold anomaly run ${GITHUB_RUN_ID}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce anomaly verifier result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp047-anomaly/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp047-anomaly/RESULT.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(r.disposition!=='CONFIRMED') process.exit(1);
          NODE
