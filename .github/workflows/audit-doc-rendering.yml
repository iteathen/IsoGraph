name: Audit documentation rendering

on:
  push:
    branches:
      - maintenance/document-rendering-audit-20260926
    paths:
      - maintenance/doc-rendering-audit/RUN.request

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Audit Markdown and text rendering
        run: node tools/audit-doc-rendering.mjs
