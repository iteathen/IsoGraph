name: Experiment 062 W G1 W04b six original author source local 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_W04B_SIX_UNREVIEWED_SOURCE_FIRST_0_2.json'
      - 'experiments/062/tools/cold-w04b-original-author-g1-0-2.py'
      - 'experiments/062/tools/verify-w-g1-w04b-six-original-0-3.cjs'
      - '.github/workflows/experiment-062-w-g1-w04b-six-original-0-3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: |
          python3 -m py_compile experiments/062/tools/cold-w04b-original-author-g1-0-2.py
          node --check experiments/062/tools/verify-w-g1-w04b-six-original-0-3.cjs
      - name: Read original W04b article twice, verify 19 original prose anchors
        run: python3 -u experiments/062/tools/cold-w04b-original-author-g1-0-2.py
      - name: Exact W04b original 6 G1 source bodies and 30 hostile mutations
        run: node experiments/062/tools/verify-w-g1-w04b-six-original-0-3.cjs
      - name: Preserve nine-source G0 source census and freeze
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
