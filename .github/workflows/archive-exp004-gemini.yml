name: Archive Experiment 004 Gemini Evidence

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/archive-exp004-gemini.yml

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out results branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: experiment/004-gemini-results
          fetch-depth: 0

      - name: Materialize verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash experiments/004/tools/archive-gemini-v3-evidence.sh

      - name: Commit frozen evidence verbatim
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/004/cold-results/gemini/raw
          git commit -m "experiment: archive Gemini V3 cold evidence"
          git push origin HEAD:experiment/004-gemini-results
