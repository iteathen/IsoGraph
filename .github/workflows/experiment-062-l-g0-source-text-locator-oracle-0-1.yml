name: Experiment 062 L G0 frozen original source text locator oracle 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/probe-l-g0-original-source-text-locations-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-source-text-locator-oracle-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-first-locations:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node experiments/062/tools/probe-l-g0-original-source-text-locations-0-1.mjs
