name: MIPLIB n5 active graph-builder optimization 0.2

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/miplib-structural-presolve-20261006
    paths:
      - .github/workflows/experiment-miplib-n5-active-graph-builder.yml
      - research/miplib-structural-presolve/N5_3_ACTIVE_GRAPH_BUILDER_OPT_0_2.md
      - research/miplib-structural-presolve/tools/run-n5-active-graph-builder-opt-0.2.py

permissions:
  contents: write

concurrency:
  group: miplib-n5-active-graph-builder-opt-0.2
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install frozen tools
        run: python3 -m pip install --disable-pip-version-check highspy==1.15.1 igraph==0.11.9 pyscipopt==6.2.1
      - name: Execute graph-builder benchmark
        id: experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf out/miplib-n5-active-graph-builder-opt-0.2
          python3 -m py_compile research/miplib-structural-presolve/tools/run-n5-active-graph-builder-opt-0.2.py
          python3 research/miplib-structural-presolve/tools/run-n5-active-graph-builder-opt-0.2.py
      - name: Persist evidence
        if: always()
        run: |
          set -euo pipefail
          E="research/miplib-structural-presolve/evidence/n5-active-graph-builder-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in RESULT.json SUMMARY.md; do
            [ -f "out/miplib-n5-active-graph-builder-opt-0.2/$f" ] && cp "out/miplib-n5-active-graph-builder-opt-0.2/$f" "$E/$f"
          done
          python3 - <<'PY' > "$E/CONTROL.json"
          import json, os
          print(json.dumps({
            "workflow_run_id": os.environ["GITHUB_RUN_ID"],
            "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "source_sha": os.environ["GITHUB_SHA"],
            "profile": "n5-active-graph-builder-opt-0.2"
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: n5 active graph-builder ${GITHUB_RUN_ID}"
            git fetch origin experiment/miplib-structural-presolve-20261006
            git rebase origin/experiment/miplib-structural-presolve-20261006
            git push origin HEAD:experiment/miplib-structural-presolve-20261006
          fi
      - name: Enforce
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = "success"
          test -f out/miplib-n5-active-graph-builder-opt-0.2/RESULT.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/miplib-n5-active-graph-builder-opt-0.2/RESULT.json"))
          print(json.dumps({"disposition":r["disposition"],"median_speed_ratio":r["median_speed_ratio"],"identity":r["identity"]},indent=2))
          if r["disposition"]!="PASS": raise SystemExit(1)
          PY
