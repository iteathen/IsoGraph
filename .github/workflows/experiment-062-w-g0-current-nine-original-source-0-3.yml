name: Experiment 062 W G0 nine current originals inverse qualification 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G0_NINE_CURRENT_SOURCE_FIRST_INVENTORY_0_1.json'
      - 'experiments/062/tools/verify-w-g0-current-nine-source-0-3.cjs'
      - 'experiments/062/tools/verify-w-current-source-fingerprints-0-1.py'
      - '.github/workflows/experiment-062-w-g0-current-nine-original-source-0-3.yml'
      - 'research/woit-lisi-isomorph/woit/W_CURRENT_AUTHOR_SOURCE_SCOPE_2026_10_11_0_1.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: |
          node --check experiments/062/tools/verify-w-g0-current-nine-source-0-3.cjs
          python3 -m py_compile experiments/062/tools/verify-w-current-source-fingerprints-0-1.py
      - name: All-nine source-first 649 source intervals 560 reciprocal links and 29 hostile
        run: node experiments/062/tools/verify-w-g0-current-nine-source-0-3.cjs
      - name: Three versioned W original papers and 22 hostility controls
        run: node experiments/062/tools/verify-w-g0-exact-reciprocal-original-index-0-1.cjs
      - name: Reacquire current author pages and linked PDFs
        run: python3 -u experiments/062/tools/capture-w-current-author-sources-0-3.py
      - name: Verify exact six author bodies and two PDF bytes with eight hostile
        run: python3 -u experiments/062/tools/verify-w-current-source-fingerprints-0-1.py
