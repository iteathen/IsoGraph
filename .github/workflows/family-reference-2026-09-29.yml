name: Refresh IsoGraph family reference 2026-09-29

on:
  push:
    branches:
      - qualification/family-cleanup-ei-20260929
    paths:
      - maintenance/FAMILY_REFERENCE_2026-09-29.request

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Update maintained DOCX
        env:
          AUTHORITY_SNAPSHOT: d242a183c142bd6e9b1f9240495972e30ad9f657
        run: |
          set -euo pipefail
          node maintenance/update-family-reference-2026-09-29.mjs
      - name: Render and deterministic QA
        run: |
          set -euo pipefail
          mkdir -p out/family-reference/render
          if command -v libreoffice >/dev/null 2>&1; then
            OFFICE=libreoffice
          elif command -v soffice >/dev/null 2>&1; then
            OFFICE=soffice
          else
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer poppler-utils
            OFFICE=libreoffice
          fi
          "$OFFICE" --headless --convert-to pdf --outdir out/family-reference IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx
          PDF=out/family-reference/IsoGraph_Family_Reference_Joshua_Oshiro_2026.pdf
          test -s "$PDF"
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          unzip -p IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx word/document.xml > out/family-reference/document.xml
          grep -F "Current Qualified Authority - 2026-09-29" out/family-reference/document.xml
          grep -F "Experiment 056" out/family-reference/document.xml
          PAGE_COUNT=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          DOCX_SHA=$(sha256sum IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx | awk '{print $1}')
          DOCX_BYTES=$(stat -c %s IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx)
          cat > maintenance/FINAL_PRODUCT_REFRESH_2026-09-29.md <<EOF
          # Final Product Refresh — 2026-09-29

          **Status:** repository-root DOCX refreshed and deterministic render completed
          **Authority snapshot represented:** `d242a183c142bd6e9b1f9240495972e30ad9f657`
          **DOCX:** `IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx`
          **DOCX SHA-256:** `$DOCX_SHA`
          **DOCX bytes:** `$DOCX_BYTES`
          **Rendered pages:** `$PAGE_COUNT`

          The accumulated reference now routes the qualified Core through 0.20, QU 0.1, NEI 0.4, Discovery Protocols through 0.10, DTS 0.1, Experimental Inquiry 0.1, and Experiment 056 expanded-stack integration.

          Repository semantic authority remains the exact versioned specifications, qualification records, and `qualification/QUALIFIED_MODULES_2026-09-29.md`.

          Visual page QA is performed separately before final merge. The ChatGPT Library mirror remains a separate publication projection.
          EOF
      - name: Persist refreshed final product
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IsoGraph_Family_Reference_Joshua_Oshiro_2026.docx maintenance/FINAL_PRODUCT_REFRESH_2026-09-29.md
          git commit -m "Refresh IsoGraph family reference for DP 0.10 and EI 0.1"
          git fetch origin qualification/family-cleanup-ei-20260929
          git rebase origin/qualification/family-cleanup-ei-20260929
          git push origin HEAD:qualification/family-cleanup-ei-20260929
