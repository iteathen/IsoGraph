name: Experiment 062 W G1 W01 Palatini Hodge corrected 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_W01_PALATINI_HODGE_SOURCE_FIRST_CANDIDATES_0_1.json'
      - 'experiments/062/tools/verify-w-g1-w01-palatini-hodge-0-2.cjs'
      - '.github/workflows/experiment-062-w-g1-w01-palatini-hodge-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Verify W01 Palatini Hodge source-local mechanical integrity
        run: |
          node --check experiments/062/tools/verify-w-g1-w01-palatini-hodge-0-2.cjs
          node experiments/062/tools/verify-w-g1-w01-palatini-hodge-0-2.cjs
      - name: Recheck qualified W G1 stage39 and frozen current-author G0
        run: |
          node experiments/062/tools/verify-w-g1-current-39-body-stage-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
