name: Experiment 067 provisional qualification verify
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/067/OWNER_BYPASS_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/067/tools/verify-provisional-qualification-0-1.mjs'
      - '.github/workflows/experiment-067-provisional-qualification.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/067/tools/verify-provisional-qualification-0-1.mjs
