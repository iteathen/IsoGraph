name: Experiment 045 ternary threshold-16 critical cover

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/045/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-045-glycan-width-search
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Build exact critical-cover search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/exp045
          g++ -std=c++20 -O3 -march=x86-64 -DNDEBUG             experiments/045/tools/run-exp045.cpp             -o out/exp045/run-exp045

      - name: Execute threshold-16 search
        shell: bash
        run: |
          set -euo pipefail
          ./out/exp045/run-exp045

      - name: Persist Experiment 045 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/045/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -f out/exp045/RESULT.json ] && cp out/exp045/RESULT.json "$E/RESULT.json"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 045 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce verified minimal cover
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp045/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp045/RESULT.json','utf8'));
          console.log(JSON.stringify({
            disposition:r.disposition,
            best_cover_size:r.best_cover_size,
            threshold_uncovered_words:r.threshold_uncovered_words,
            missing_private_witnesses:r.missing_private_witnesses,
            exact_witness_width:r.exact_witness_width
          },null,2));
          if(r.disposition!=='PASS') process.exit(1);
          if(r.threshold_uncovered_words!==0) process.exit(1);
          if(r.missing_private_witnesses!==0) process.exit(1);
          if(!(r.exact_witness_width>=54)) process.exit(1);
          NODE
