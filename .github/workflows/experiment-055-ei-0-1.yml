name: Experiment 055 Experimental Inquiry qualification
on:
  push:
    branches: [qualification/family-cleanup-ei-20260929]
    paths: [experiments/055/RUN.request]
permissions: {contents: write}
concurrency: {group: experiment-055-ei01, cancel-in-progress: false}
env:
  GEMINI_MODEL: gemini-3.8-flash
  GEMINI_FALLBACK_MODELS: gemini-3.7-flash,gemini-3.1-pro-preview,gemini-pro-latest
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Preflight
        run: |
          set -euo pipefail
          node --check experiments/055/tools/run-exp055-cold.mjs
          node --check experiments/055/tools/score-exp055.mjs
          rm -rf out/exp055
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/055/tools/run-exp055-cold.mjs
          node -e "const d=require('./out/exp055/DRY_RUN.json');if(d.case_count!==18||!/^[0-9a-f]{64}$/.test(d.ei_0_1_sha256))process.exit(1)"
      - name: Execute isolated reasoner
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/055/tools/run-exp055-cold.mjs
      - name: Hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        run: node experiments/055/tools/score-exp055.mjs
      - name: Persist evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          E="experiments/055/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"; mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do [ -f "out/exp055/$f" ] && cp "out/exp055/$f" "$E/$f"; done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add "$E"
          if ! git diff --cached --quiet; then git commit -m "evidence: Experiment 055 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"; git fetch origin qualification/family-cleanup-ei-20260929; git rebase origin/qualification/family-cleanup-ei-20260929; git push origin HEAD:qualification/family-cleanup-ei-20260929; fi
      - name: Enforce
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          test "$COLD_OUTCOME" = success
          test "$SCORE_OUTCOME" = success
          node -e "const s=require('./out/exp055/SCORE.json');if(s.disposition!=='QUALIFIES')process.exit(1)"
