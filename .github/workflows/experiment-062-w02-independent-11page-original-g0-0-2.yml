      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Verify original independent 11-page W02 source with repaired nonload case
        run: |
          node --check experiments/062/tools/verify-w02-independent-11page-original-g0-0-2.cjs
          node experiments/062/tools/verify-w02-independent-11page-original-g0-0-2.cjs
