name: "Experiment 062 W G0 original page source inverse hostile corrected 0.3"
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - "experiments/062/W04E_G0_PAGE_VERIFIER_COEDIT_MUTATION_ESCAPE_0_1.json"
      - "experiments/062/tools/verify-w04e-g0-original-page-boundaries-0-3.cjs"
      - ".github/workflows/experiment-062-w-g0-page-boundary-source-inverse-0-3.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  w_g0_page_source_independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Verify frozen SSC0.67 source-five math with its original source-scoped verifier
        run: |
          node --check experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-5.cjs
          node experiments/062/tools/verify-w-g0-finite-bidirectional-convergence-0-5.cjs
      - name: Independently fixed original source and hostile page-boundary checks
        run: |
          node --check experiments/062/tools/verify-w04e-g0-original-page-boundaries-0-3.cjs
          node experiments/062/tools/verify-w04e-g0-original-page-boundaries-0-3.cjs
