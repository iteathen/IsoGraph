name: MIPLIB exact symmetry follow-up

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/miplib-structural-presolve-20261006
    paths:
      - .github/workflows/experiment-miplib-symmetry.yml
      - research/miplib-structural-presolve/SYMMETRY_RUN.request
      - research/miplib-structural-presolve/tools/run-symmetry-pass.py

permissions:
  contents: write

concurrency:
  group: miplib-structural-presolve-symmetry
  cancel-in-progress: false

jobs:
  symmetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install frozen solver
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check highspy==1.15.1

      - name: Syntax check
        run: python3 -m py_compile research/miplib-structural-presolve/tools/run-symmetry-pass.py

      - name: Execute exact symmetry follow-up
        id: experiment
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf out/miplib-structural-presolve-symmetry
          python3 research/miplib-structural-presolve/tools/run-symmetry-pass.py

      - name: Persist evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="research/miplib-structural-presolve/evidence/symmetry-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in SYMMETRY_RESULT.json SYMMETRY_SUMMARY.md; do
            [ -f "out/miplib-structural-presolve-symmetry/$f" ] && cp "out/miplib-structural-presolve-symmetry/$f" "$E/$f"
          done
          python3 - <<'PY' > "$E/CONTROL.json"
          import json, os, highspy
          print(json.dumps({
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_sha": os.environ["GITHUB_SHA"],
              "highs_version": highspy.Highs().version(),
              "profile": "exact-restricted-transposition-0.1"
          }, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898233+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: MIPLIB symmetry run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin experiment/miplib-structural-presolve-20261006
            git rebase origin/experiment/miplib-structural-presolve-20261006
            git push origin HEAD:experiment/miplib-structural-presolve-20261006
          fi

      - name: Enforce result
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = "success"
          test -f out/miplib-structural-presolve-symmetry/SYMMETRY_RESULT.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/miplib-structural-presolve-symmetry/SYMMETRY_RESULT.json"))
          print(json.dumps({
              "disposition": r["disposition"],
              "chosen_breaker": r["chosen_breaker"],
              "comparison": r.get("comparison"),
              "failures": r["failures"]
          }, indent=2))
          if r["disposition"] != "PASS":
              raise SystemExit(1)
          PY
