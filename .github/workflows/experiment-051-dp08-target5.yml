name: Experiment 051 DP 0.8 target-5 replacement

on:
  push:
    branches: [qualification/core020-dp08-20260928]
    paths: [experiments/051/RUN.request]

permissions:
  contents: write

env:
  GEMINI_MODEL: gemini-3-flash-preview
  GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.1-pro-preview,gemini-3.1-flash-lite,gemini-pro-latest

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 26.7.0}
      - name: Deterministic preflight
        run: |
          set -euo pipefail
          node experiments/051/tools/test-schema-exp051.mjs
          node experiments/051/tools/test-score-exp051.mjs
          node experiments/051/tools/test-runner-exp051.mjs
          rm -rf out/exp051
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/051/tools/run-exp051-cold.mjs
      - name: Execute isolated decoder
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/051/tools/run-exp051-cold.mjs
      - name: Hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp051/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp051/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/051/tools/score-exp051.mjs
      - name: Persist evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          E="experiments/051/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp051/$f" ] && cp "out/exp051/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 051 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin qualification/core020-dp08-20260928
            git rebase origin/qualification/core020-dp08-20260928
            git push origin HEAD:qualification/core020-dp08-20260928
          fi
      - name: Enforce target-5 qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = success
          test "$SCORE_OUTCOME" = success
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp051/SCORE.json','utf8'));if(s.disposition!=='QUALIFIES')process.exit(1);console.log(JSON.stringify(s,null,2))"
