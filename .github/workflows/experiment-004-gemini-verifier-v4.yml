name: Experiment 004 Gemini Independent Verifier V4

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/experiment-004-gemini-verifier-v4.yml

permissions:
  contents: read

concurrency:
  group: experiment-004-gemini-verifier-flash-lite
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-flash-lite-latest

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Gemini Flash-Lite access
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r,ms));
          let ok=false;
          for(let i=0;i<4;i++){
            const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent', {
              method:'POST',
              headers:{'Content-Type':'application/json','x-goog-api-key':process.env.GEMINI_API_KEY},
              body:JSON.stringify({contents:[{role:'user',parts:[{text:'Reply exactly ISOGRAPH_OK'}]}],generationConfig:{maxOutputTokens:256}})
            });
            const body=await r.text();
            if(r.ok){const d=JSON.parse(body); const t=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim(); console.log(t); if(t.includes('ISOGRAPH_OK')){ok=true;break}}
            else console.error(`preflight HTTP ${r.status}: ${body.slice(0,1000)}`);
            if(![429,500,502,503,504].includes(r.status)) break;
            await sleep(5000*(i+1));
          }
          if(!ok) process.exit(1);
          NODE

  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [RUN-D09, RUN-D10, RUN-D16, RUN-D18, RUN-D19, RUN-D20S, RUN-D20L]
    steps:
      - name: Check out evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Fetch Claude evidence branch
        shell: bash
        run: git fetch origin experiment/004-cold-results-claude:refs/remotes/origin/experiment/004-cold-results-claude

      - name: Bound verifier output
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/maxOutputTokens: 65536/maxOutputTokens: 32768/' experiments/004/tools/run-gemini-verifier.mjs
          grep -F 'maxOutputTokens: 32768' experiments/004/tools/run-gemini-verifier.mjs

      - name: Execute scorer-blind structural verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: ${{ matrix.run }}
        run: node experiments/004/tools/run-gemini-verifier.mjs

      - name: Emit verifier evidence to log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for p in out/*_VERIFIER_REPORT.txt out/*_VERIFIER_METADATA.json; do
            [ -f "$p" ] || continue
            found=1
            echo "===== BEGIN $(basename "$p") ====="
            cat "$p"
            echo "===== END $(basename "$p") ====="
          done
          echo "Evidence file hashes:"
          find out -maxdepth 2 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum
          test "$found" -eq 1
