name: Experiment 062 W G2 neutral graph verify

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/G1_OWNER_COLD_AUDIT_WAIVER_0_1.json
      - experiments/062/W_EXTRACTION_RECONCILED_0_18.json
      - experiments/062/tools/generate-w-g2-neutral-occurrence-graph-0-1.mjs
      - experiments/062/tools/verify-w-g2-neutral-occurrence-graph-0-1.mjs
      - .github/workflows/experiment-062-w-g2-neutral-graph.yml
  pull_request:
    paths:
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/G1_OWNER_COLD_AUDIT_WAIVER_0_1.json
      - experiments/062/W_EXTRACTION_RECONCILED_0_18.json
      - experiments/062/tools/generate-w-g2-neutral-occurrence-graph-0-1.mjs
      - experiments/062/tools/verify-w-g2-neutral-occurrence-graph-0-1.mjs
      - .github/workflows/experiment-062-w-g2-neutral-graph.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify W G2 neutral graph
        run: node experiments/062/tools/verify-w-g2-neutral-occurrence-graph-0-1.mjs
