name: Experiment 062 W G0 original reciprocal source index 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-w-g0-exact-reciprocal-original-index-0-1.cjs'
      - '.github/workflows/experiment-062-w-g0-exact-reciprocal-source-index-0-1.yml'
      - 'research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_70.json'
      - 'experiments/062/W_G0_FINITE_BIDIRECTIONAL_CONVERGENCE_0_9.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g0-exact-reciprocal-original-index-0-1.cjs
      - run: node experiments/062/tools/verify-w-g0-exact-reciprocal-original-index-0-1.cjs
