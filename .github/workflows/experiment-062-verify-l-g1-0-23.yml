name: Experiment 062 verify L G1 0.23

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_EXTRACTION_RECONCILED_0_23.json'
      - 'experiments/062/L_G1_SOURCE_LOCAL_ADJUDICATION_0_23.json'
      - 'experiments/062/tools/verify-l-extraction-reconciled-0-23.mjs'
      - '.github/workflows/experiment-062-verify-l-g1-0-23.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L G1 reconciled 0.23
        run: node experiments/062/tools/verify-l-extraction-reconciled-0-23.mjs
