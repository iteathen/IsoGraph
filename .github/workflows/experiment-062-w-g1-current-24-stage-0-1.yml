name: Experiment 062 W G1 24-body current source stage qualification 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_SOURCE_LOCAL_CONVERGENCE_STAGE_0_5.json'
      - 'experiments/062/tools/verify-w-g1-current-24-stage-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-current-24-stage-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: |
          node --check experiments/062/tools/verify-w-g1-current-24-stage-0-1.cjs
          python3 -m py_compile experiments/062/tools/verify-w-g1-three-original-PDF-0-2.py
      - name: Verify 24 reviewed source IDs 127 remaining, original lineage and 25 hostile stage mutations
        run: node experiments/062/tools/verify-w-g1-current-24-stage-0-1.cjs
      - name: Rerun original author source PDF SHA and semantic source first checks
        run: |
          command -v pdfinfo || { sudo apt-get update -qq && sudo apt-get install -y poppler-utils; }
          python3 -u experiments/062/tools/verify-w-g1-three-original-PDF-0-2.py
      - name: Preserve exact frozen current G0 151 source original inverse
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
