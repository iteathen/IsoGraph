name: Experiment 062 verify W G1 0.31 source-operator closure
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W097_G1_OPERATOR_MULTIPLICITY_AND_ANTIHOLOMORPHIC_DEFECT_0_1.json'
      - 'experiments/062/W_G1_SOURCE_LOCAL_ADJUDICATION_0_31.json'
      - 'experiments/062/W_EXTRACTION_RECONCILED_0_31.json'
      - 'experiments/062/tools/apply-w-g1-adjudication-0-31.mjs'
      - 'experiments/062/tools/verify-w-extraction-reconciled-0-31.mjs'
      - '.github/workflows/experiment-062-verify-w-g1-0-31.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/apply-w-g1-adjudication-0-31.mjs
      - run: git diff --exit-code -- experiments/062/W_EXTRACTION_RECONCILED_0_31.json
      - run: node experiments/062/tools/verify-w-extraction-reconciled-0-31.mjs
