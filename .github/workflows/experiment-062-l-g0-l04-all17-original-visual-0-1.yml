name: Experiment 062 L G0 all17 frozen L04 original visual cold audit 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - '.github/workflows/experiment-062-l-g0-l04-all17-original-visual-0-1.yml'
      - 'experiments/062/tools/render-l-g0-l04-all17-original-visual-0-1.mjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L04-complete-original-first-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4]
    env:
      L04_COLD_CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/render-l-g0-l04-all17-original-visual-0-1.mjs
      - run: node experiments/062/tools/render-l-g0-l04-all17-original-visual-0-1.mjs
