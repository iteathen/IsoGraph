name: Experiment 062 W01 main sections 4-6 complete original source G0 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W01_G0_MAIN_S4_S6_FULL_ORIGINAL_FIRST_0_1.json'
      - 'experiments/062/tools/verify-w01-main-s4-s6-original-first-g0-0-1.cjs'
      - '.github/workflows/experiment-062-w01-main-s4-s6-original-first-g0-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w01-main-s4-s6-original-first-g0-0-1.cjs
      - run: node experiments/062/tools/verify-w01-main-s4-s6-original-first-g0-0-1.cjs
