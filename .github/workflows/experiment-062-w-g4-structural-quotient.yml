name: Experiment 062 W G4 structural quotient verify

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/W_G4_ALPHA_RENAMED_STRUCTURAL_QUOTIENT_0_1.json
      - experiments/062/W_G3_CORE_DEFINABILITY_0_5.json
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/tools/generate-w-g4-alpha-structural-quotient-0-1.mjs
      - experiments/062/tools/verify-w-g4-alpha-structural-quotient-0-1.mjs
      - .github/workflows/experiment-062-w-g4-structural-quotient.yml
  pull_request:
    paths:
      - experiments/062/W_G4_ALPHA_RENAMED_STRUCTURAL_QUOTIENT_0_1.json
      - experiments/062/W_G3_CORE_DEFINABILITY_0_5.json
      - experiments/062/W_G2_NEUTRAL_OCCURRENCE_GRAPH_0_1.json
      - experiments/062/tools/generate-w-g4-alpha-structural-quotient-0-1.mjs
      - experiments/062/tools/verify-w-g4-alpha-structural-quotient-0-1.mjs
      - .github/workflows/experiment-062-w-g4-structural-quotient.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify W G4 structural quotient
        run: node experiments/062/tools/verify-w-g4-alpha-structural-quotient-0-1.mjs
