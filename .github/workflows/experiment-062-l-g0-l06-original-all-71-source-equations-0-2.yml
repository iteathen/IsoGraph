name: Experiment 062 L G0 L06 all 71 original source numbered equations 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L06_ORIGINAL_71_EQ_INITIAL_VERIFIER_FIELD_ALIAS_FAILED_CI_0_1.json'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_85.json'
      - 'experiments/062/tools/verify-l-g0-l06-all-71-original-source-equations-0-2.mjs'
      - '.github/workflows/experiment-062-l-g0-l06-original-all-71-source-equations-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-first-equation-crosswalk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-l-g0-l06-all-71-original-source-equations-0-2.mjs
      - run: node experiments/062/tools/verify-l-g0-l06-all-71-original-source-equations-0-2.mjs
