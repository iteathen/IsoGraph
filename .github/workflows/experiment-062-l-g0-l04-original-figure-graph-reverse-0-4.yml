name: Experiment 062 L G0 original L04 figure/polarity stage-guard 0.4
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-4.mjs'
      - 'experiments/062/L04_FIGURES_THIRD_SOURCE_GRAPH_56_OF_57_HOSTILE_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l04-original-figure-graph-reverse-0-4.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L04-original-figure-graph-stage-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-4.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-4.mjs
