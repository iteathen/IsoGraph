name: Experiment 062 L G0 L03 four original complete matrix tables 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L03_FOUR_ORIGINAL_MATRICES_SECOND_CI_GATE_AND_ROW_FAILURE_0_1.json'
      - 'experiments/062/tools/verify-l-g0-l03-four-original-full-matrix-tables-0-3.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_117.json'
      - '.github/workflows/experiment-062-l-g0-l03-four-matrix-full-original-preflight-0-3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L03-four-original-matrices-failclosed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l03-four-original-full-matrix-tables-0-3.mjs
      - run: node experiments/062/tools/verify-l-g0-l03-four-original-full-matrix-tables-0-3.mjs
