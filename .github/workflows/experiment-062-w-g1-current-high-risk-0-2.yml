      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g1-current-high-risk-0-2.cjs
      - name: Source-first high-risk G1 occurrence review, typed provenance, modalities and 25 hostile
        run: node experiments/062/tools/verify-w-g1-current-high-risk-0-2.cjs
      - name: Whole 151 W G1 source frontier and G0 frozen authority guards
        run: |
          node experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
