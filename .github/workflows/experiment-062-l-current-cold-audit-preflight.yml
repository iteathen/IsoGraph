name: Experiment 062 L current cold-audit preflight

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_1.json'
      - 'experiments/062/L_G1_COLD_AUDIT_0_25_CONTRACT_0_1.json'
      - 'experiments/062/L_G1_COMPLETE_REPEAT_AUDIT_0_1.json'
      - 'experiments/062/L_EXTRACTION_RECONCILED_0_25.json'
      - 'experiments/062/tools/verify-l-extraction-reconciled-0-25.mjs'
      - 'experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs'
      - 'experiments/062/tools/verify-l-current-stage-gate-0-1.mjs'
      - 'experiments/062/tools/run-exp062-l-g1-final-audit-0-25.mjs'
      - '.github/workflows/experiment-062-l-current-cold-audit-preflight.yml'
  pull_request:
    paths:
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_1.json'
      - 'experiments/062/L_G1_COLD_AUDIT_0_25_CONTRACT_0_1.json'
      - 'experiments/062/L_G1_COMPLETE_REPEAT_AUDIT_0_1.json'
      - 'experiments/062/L_EXTRACTION_RECONCILED_0_25.json'
      - 'experiments/062/tools/verify-l-extraction-reconciled-0-25.mjs'
      - 'experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs'
      - 'experiments/062/tools/verify-l-current-stage-gate-0-1.mjs'
      - 'experiments/062/tools/run-exp062-l-g1-final-audit-0-25.mjs'
      - '.github/workflows/experiment-062-l-current-cold-audit-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Syntax-check current cold-audit runner
        run: node --check experiments/062/tools/run-exp062-l-g1-final-audit-0-25.mjs
      - name: Verify L 0.25 deterministic extraction
        run: node experiments/062/tools/verify-l-extraction-reconciled-0-25.mjs
      - name: Verify L source-local fixed point
        run: node experiments/062/tools/verify-l-g1-source-local-fixed-point-0-1.mjs
      - name: Verify L current stage gate and cold-audit pins
        run: node experiments/062/tools/verify-l-current-stage-gate-0-1.mjs
