name: Experiment 062 primitive-demand occurrence extraction

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - experiments/062/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-062-occurrence-extraction
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.1-flash-lite

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Deterministic preflight
        run: |
          set -euo pipefail
          node --check experiments/062/tools/run-exp062-v2.mjs
          node research/primitive-demand-qualification/tools/verify_joint_primitive_demand_graph.mjs || true
          test -f research/primitive-demand-qualification/PRIMITIVE_DEMAND_REGROUNDING_AUDIT_0_1.json
          test -f research/primitive-demand-qualification/PRIMITIVE_DEMAND_GRAPH_FIRST_METHOD_0_2.md

      - name: Stage reconciled W extraction
        run: |
          mkdir -p out/exp062/W
          cp experiments/062/W_EXTRACTION_RECONCILED_0_1.json out/exp062/W/EXTRACTION.json

      - name: Audit reconciled W extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/062/tools/run-exp062-v2.mjs W audit

      - name: Extract L occurrences
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/062/tools/run-exp062-v2.mjs L extract

      - name: Audit L extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/062/tools/run-exp062-v2.mjs L audit

      - name: Persist research evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/woit-lisi-isomorph-20261003
          git merge --ff-only origin/research/woit-lisi-isomorph-20261003
          E="experiments/062/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -d out/exp062 ] && cp -R out/exp062 "$E/"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 062 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:research/woit-lisi-isomorph-20261003
          fi
