name: Experiment 044 ternary witness width 54

on:
  push:
    branches:
      - research/glycan-cleavage-primitive-20260927
    paths:
      - experiments/044/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-044-glycan-width54
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Execute exact width-54 verification
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/044/tools/run-exp044.mjs
          rm -rf out/exp044
          node experiments/044/tools/run-exp044.mjs

      - name: Persist Experiment 044 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/044/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          [ -f out/exp044/RESULT.json ] && cp out/exp044/RESULT.json "$E/RESULT.json"
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 044 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin research/glycan-cleavage-primitive-20260927
            git rebase origin/research/glycan-cleavage-primitive-20260927
            git push origin HEAD:research/glycan-cleavage-primitive-20260927
          fi

      - name: Enforce experiment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f out/exp044/RESULT.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/exp044/RESULT.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(r.disposition!=='PASS') process.exit(1);
          if(r.exact_witness_width!==54) process.exit(1);
          if(r.exact_optimum!==15) process.exit(1);
          NODE
