name: Fix documentation rendering

on:
  push:
    branches:
      - maintenance/document-rendering-audit-20260926
    paths:
      - maintenance/doc-rendering-audit/FIX.request

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0
      - name: Convert unsupported TeX delimiters
        run: node tools/fix-doc-rendering.mjs
      - name: Audit corrected tree
        run: |
          node tools/audit-doc-rendering.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('out/doc-rendering-audit.json','utf8'));
          if(r.mutable_findings!==0){
            console.error('mutable rendering findings remain:',r.mutable_findings);
            const rows=r.findings.filter(x=>x.classification==='mutable-documentation').slice(0,50);
            console.error(JSON.stringify(rows,null,2));
            process.exit(1);
          }
          console.log('mutable_documentation_findings=0');
          NODE
      - name: Commit documentation rendering fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md DESIGN_NOTES.md research/navier-stokes-proof
          git commit -m "Fix GitHub math rendering in mutable documentation"
          git push origin HEAD:maintenance/document-rendering-audit-20260926
