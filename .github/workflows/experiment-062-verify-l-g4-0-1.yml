name: Experiment 062 L G4 structural quotient verify

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G4_ALPHA_RENAMED_STRUCTURAL_QUOTIENT_0_1.json'
      - 'experiments/062/tools/generate-l-g4-alpha-structural-quotient-0-1.mjs'
      - 'experiments/062/tools/verify-l-g4-alpha-structural-quotient-0-1.mjs'
      - '.github/workflows/experiment-062-verify-l-g4-0-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify L-local G4 structural quotient
        run: node experiments/062/tools/verify-l-g4-alpha-structural-quotient-0-1.mjs
