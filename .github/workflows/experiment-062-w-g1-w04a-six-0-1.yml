name: Experiment 062 W G1 W04a six remaining author originals 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_W04A_SIX_REMAINING_AUTHOR_SOURCE_FIRST_0_1.json'
      - 'experiments/062/tools/audit-w-g1-w04a-six-original-0-1.py'
      - 'experiments/062/tools/verify-w-g1-w04a-six-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-w04a-six-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: |
          python3 -m py_compile experiments/062/tools/audit-w-g1-w04a-six-original-0-1.py
          node --check experiments/062/tools/verify-w-g1-w04a-six-0-1.cjs
      - name: Independent Woit original author direct two-fetch, eleven source witnesses and 8 hostile
        run: python3 -u experiments/062/tools/audit-w-g1-w04a-six-original-0-1.py
      - name: Exact original G0 and six source-local G1 candidates, 28 hostile controls
        run: node experiments/062/tools/verify-w-g1-w04a-six-0-1.cjs
      - name: Preserve previous 27 W current G1 and entire 151 G0 frozen original
        run: |
          node experiments/062/tools/verify-w-g1-current-27-body-stage-0-1.cjs
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
