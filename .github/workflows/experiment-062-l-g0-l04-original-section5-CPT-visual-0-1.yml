name: Experiment 062 L G0 frozen L04 original §5 C P T source visual 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/render-l-g0-l04-original-section5-CPT-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-l04-original-section5-CPT-visual-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-CPT-source-p10:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/render-l-g0-l04-original-section5-CPT-0-1.mjs
      - run: node experiments/062/tools/render-l-g0-l04-original-section5-CPT-0-1.mjs
