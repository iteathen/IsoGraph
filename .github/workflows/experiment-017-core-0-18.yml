name: Experiment 017 Core 0.18 qualification

on:
  push:
    branches:
      - qualification/core-0-18-017-20260925
    paths:
      - experiments/017/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-017-core-0-18
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.5-flash

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact qualification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Deterministic preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/017/tools/run-exp017-cold.mjs
          node --check experiments/017/tools/score-exp017.mjs
          node --check experiments/017/tools/test-score-exp017.mjs
          node experiments/017/tools/test-score-exp017.mjs
          rm -rf out/exp017
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/017/tools/run-exp017-cold.mjs
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('out/exp017/DRY_RUN.json','utf8'));const p=d.input_manifest.map(x=>x.path);const bad=['hidden/','ASSERTIONS','score-exp017','AUTHORING_AUDIT','QUALIFICATION_REVIEW','experiments/017/evidence','AGENTS.md','README.md','STATUS.md'];for(const f of bad){if(p.some(x=>x.includes(f)))throw new Error('forbidden cold input '+f)}const req=['CORE_SPEC_DRAFT_0_17_CONSOLIDATED_QUALIFIED.md','CORE_SPEC_DRAFT_0_18_OBSERVATION_FIRST_CANDIDATE.md','experiments/017/CORE_0_18_CASES.md'];for(const f of req){if(!p.includes(f))throw new Error('missing cold input '+f)}console.log('dry_packet_sha256='+d.packet_sha256)"

      - name: Execute isolated semantic call
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/017/tools/run-exp017-cold.mjs

      - name: Verify packet identity and score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp017/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp017/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/017/tools/score-exp017.mjs

      - name: Persist sanitized evidence to branch
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/017/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp017/$f" ] && cp "out/exp017/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","qualification_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 017 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:qualification/core-0-18-017-20260925
          fi

      - name: Enforce qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = "success"
          test -f out/exp017/SCORE.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp017/SCORE.json','utf8'));console.log(JSON.stringify({disposition:s.disposition,core:s.core_0_18},null,2));if(s.disposition!=='QUALIFIES')process.exit(1)"
