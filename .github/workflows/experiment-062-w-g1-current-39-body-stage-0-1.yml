name: Experiment 062 W G1 current-author 39-body source stage 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G1_CURRENT_AUTHOR_SOURCE_LOCAL_CONVERGENCE_STAGE_0_8.json'
      - 'experiments/062/tools/verify-w-g1-current-39-body-stage-0-1.cjs'
      - '.github/workflows/experiment-062-w-g1-current-39-body-stage-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g1-current-39-body-stage-0-1.cjs
      - name: Exact 151-current SSC source stage and 28 hostile promotion controls
        run: node experiments/062/tools/verify-w-g1-current-39-body-stage-0-1.cjs
      - name: Recheck W04b original six author source bodies and previous W33 stage
        run: |
          node experiments/062/tools/verify-w-g1-current-33-body-stage-0-1.cjs
          node experiments/062/tools/verify-w-g1-current-source-frontier-0-1.cjs
      - name: Ensure G0 original source frozen / Oct03 remains open
        run: |
          node experiments/062/tools/verify-w-g0-current-nine-source-0-4.cjs
          node experiments/062/tools/verify-w-g0-current-author-freeze-0-2.cjs
