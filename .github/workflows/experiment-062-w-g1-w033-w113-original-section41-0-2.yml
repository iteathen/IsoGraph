        run: python3 experiments/062/tools/cold-w033-w113-w01-original-section41-0-1.py
      - name: Reversible shared-typed W033 W113 original source occurrences and 25 hostile
        run: node experiments/062/tools/verify-w-g1-w033-w113-0-2.cjs
      - name: Conserved W043 original source and qualified W G0 freeze
