    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-w-g0-current-qualified-stage-0-1.cjs'
      - '.github/workflows/experiment-062-w-g0-current-qualified-stage-0-1.yml'
      - 'experiments/062/W_G0_CURRENT_AUTHOR_SOURCE_STAGE_GATE_0_2.json'
      - 'experiments/062/W_G0_CURRENT_AUTHOR_SOURCE_EXACT_CI_FREEZE_0_1.json'
  workflow_dispatch:
