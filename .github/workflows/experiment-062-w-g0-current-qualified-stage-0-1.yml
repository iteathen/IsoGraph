      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g0-current-qualified-stage-0-1.cjs
      - run: node experiments/062/tools/verify-w-g0-current-qualified-stage-0-1.cjs
