name: Experiment 062 L G0 L02 original printed formula reconciliation 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L02_NINE_PRINTED_EQUATIONS_INITIAL_DESTRUCTIVE_MUTATION_CI_FAILURE_0_1.json'
      - 'experiments/062/tools/verify-l-g0-l02-exact-source-equations-0-2.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_74.json'
      - '.github/workflows/experiment-062-l-g0-l02-original-printed-formulas-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-printed-equations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - name: Preserve earlier source-first correspondence regression
        run: node experiments/062/tools/verify-l-g0-l02-source-first-reverse-0-3.mjs
      - name: Test printed original expressions with guarded destructive mutations
        run: node experiments/062/tools/verify-l-g0-l02-exact-source-equations-0-2.mjs
