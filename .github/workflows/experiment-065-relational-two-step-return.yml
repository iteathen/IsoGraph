name: Experiment 065 relational two-step return qualification
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/065/MODULE_SSC_0_1.json'
      - 'experiments/065/MODULE_IA_FIXED_POINT_0_1.json'
      - 'experiments/065/QUALIFICATION_CASES_0_1.json'
      - 'experiments/065/tools/qualify-relational-two-step-return-0-1.mjs'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_RELATIONAL_TWO_STEP_RETURN_SCHEMA_0_1.isg'
      - '.github/workflows/experiment-065-relational-two-step-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/065/tools/qualify-relational-two-step-return-0-1.mjs
