name: Experiment 062 L G6 linear-basis provisional qualification

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G5H_LINEAR_BASIS_SUPPORT_0_1.json'
      - 'experiments/062/L_G6_LINEAR_BASIS_MODULE_SSC_0_1.json'
      - 'experiments/062/L_G6_LINEAR_BASIS_MODULE_IA_FIXED_POINT_0_1.json'
      - 'experiments/062/L_G6_FIELD_VECTOR_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/062/tools/qualify-l-g6-linear-basis-support-0-1.mjs'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_LINEAR_FORM_CHIRAL_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_BIJECTION_ACTION_TRANSPORT_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_LINEAR_BIJECTION_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_DIMENSION_2_4_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_DIMENSION_8_SCHEMA_0_1.isg'
      - '.github/workflows/experiment-062-l-g6-linear-basis-provisional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Run deterministic G6 linear-basis qualification
        run: node experiments/062/tools/qualify-l-g6-linear-basis-support-0-1.mjs
