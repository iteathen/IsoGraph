name: Experiment 062 W097 source completeness correction
on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/W097_SOURCE_COMPLETENESS_DEFECT_AUDIT_0_2.json'
      - 'research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_5.json'
      - 'research/primitive-demand-qualification/SOURCE_DEMAND_CENSUS_0_4.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_30.json'
      - 'experiments/062/tools/verify-w097-source-completeness-0-2.mjs'
      - '.github/workflows/experiment-062-w097-source-completeness.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w097-source-completeness-0-2.mjs
