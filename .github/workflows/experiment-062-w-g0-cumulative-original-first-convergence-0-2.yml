name: Experiment 062 W cumulative original-first G0 corrected 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-w-g0-cumulative-original-first-convergence-0-2.cjs'
      - 'experiments/062/W_G0_CUMULATIVE_ORIGINAL_FIRST_V01_FAILED_CI_0_1.json'
      - '.github/workflows/experiment-062-w-g0-cumulative-original-first-convergence-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-w-g0-cumulative-original-first-convergence-0-2.cjs
      - run: node experiments/062/tools/verify-w-g0-cumulative-original-first-convergence-0-2.cjs
