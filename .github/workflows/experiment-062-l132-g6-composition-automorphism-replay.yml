name: Experiment 062 L132 G6 automorphism replay qualification

on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L132_G5H_COMPOSITION_UNIT_AUTOMORPHISM_0_2.json'
      - 'experiments/062/L132_G6_COMPOSITION_UNIT_AUTOMORPHISM_MODULE_SSC_0_2.json'
      - 'experiments/062/L132_G6_COMPOSITION_UNIT_AUTOMORPHISM_MODULE_IA_FIXED_POINT_0_2.json'
      - 'experiments/062/tools/qualify-l132-g6-composition-unit-automorphism-0-2.mjs'
      - '.github/workflows/experiment-062-l132-g6-composition-automorphism-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/qualify-l132-g6-composition-unit-automorphism-0-2.mjs
