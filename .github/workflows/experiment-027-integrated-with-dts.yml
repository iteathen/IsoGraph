name: Experiment 027 integrated current stack with DTS

on:
  push:
    branches:
      - research/dts-0.1
    paths:
      - experiments/027/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-027-integrated-with-dts
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.1-flash-lite

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Deterministic integration preflight
        shell: bash
        run: |
          set -euo pipefail

          test "$(sha256sum CORE_SPEC_DRAFT_0_18_OBSERVATION_FIRST_CANDIDATE.md | awk '{print $1}')" = "51be43bec990b0c7baf93914e074c5fc9a29ec64b00eaf91eb25b672d9c04a63"
          test "$(sha256sum extensions/qu/QUANTIFIABLE_UNKNOWN_SPEC_0_1_CANDIDATE.md | awk '{print $1}')" = "1f1510b41e4351726e4d9e714eb32ece0d5e69f0964255aabd7b4a6e94eee4cc"
          test "$(sha256sum extensions/nei/NATURAL_ENTROPIC_IDENTITY_SPEC_0_4_CANDIDATE.md | awk '{print $1}')" = "6e2f0efb1f4bfbfa55bc2c5597f1ecc5b4d7bb734216543c21ba72089b0aacee"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_1_CANDIDATE.md | awk '{print $1}')" = "25fb4f84343633a22b08b2375fa085c2e01dc7f8a799a0e038b3fcf7ecc73c6b"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_2_CANDIDATE.md | awk '{print $1}')" = "9b121b767f5ca52759bd9a7a42d32dd1e6f12872c2bcfb370277a6292dd6011c"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_3_CANDIDATE.md | awk '{print $1}')" = "c37c9caebe33dc0b7f021638ab1679930f0e7edfbb3bd9368efdfc48538a11ee"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_4_CANDIDATE.md | awk '{print $1}')" = "35e70a19f0eb6a1893f541465d76e7d37d028a9128391562afcd6c9260d462cd"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_5_CANDIDATE.md | awk '{print $1}')" = "522a1a1a89b5f1fc753e17f76a58902c0f58543916d35a51a2c60dd64fcbea0b"
          test "$(sha256sum extensions/discovery/DISCOVERY_PROTOCOLS_0_6_CANDIDATE.md | awk '{print $1}')" = "2494a135c11e5d8a2c7da63af7cbf12ed78d769536f917fd5c216d4a932fcd44"
          test "$(sha256sum extensions/dts/DETAILED_TRANSITION_SYSTEM_0_1_CANDIDATE.md | awk '{print $1}')" = "9d3478f605bc7f673e3dc73f62991a80c50b0eadebe7fbe755689e01452ae4ad"
          test "$(sha256sum extensions/dts/DTS_NATIVE_VOCAB_0_1.md | awk '{print $1}')" = "fe1a65922186232524c07f4e8b6a29fecb3e8dfcedf9de678c6678e8226986a6"
          test "$(sha256sum extensions/dts/DTS_VOCAB_0_1.isg | awk '{print $1}')" = "ac3ff97f0a22c38628b5ae05a9471a9df1bbc83833c11a16f6ac9aad5ea9f2fb"

          node tools/dts/test-dts-base.mjs
          node --check experiments/027/tools/run-exp027-cold.mjs
          node --check experiments/027/tools/score-exp027.mjs
          node --check experiments/027/tools/test-score-exp027.mjs
          node experiments/027/tools/test-score-exp027.mjs

          rm -rf out/exp027
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/027/tools/run-exp027-cold.mjs

          node - <<'NODE'
          const fs=require('fs');
          const dry=JSON.parse(fs.readFileSync('out/exp027/DRY_RUN.json','utf8'));
          const paths=dry.input_manifest.map(item=>item.path);
          const expected=[
            'experiments/027/QUALIFIED_STACK_PACKET.md',
            'experiments/027/INTEGRATED_WITH_DTS_CASES.md',
            'experiments/027/COLD_PROMPT.md'
          ];
          if(JSON.stringify(paths)!==JSON.stringify(expected)){
            throw new Error('unexpected cold packet manifest '+JSON.stringify(paths));
          }
          const forbidden=[
            'hidden/','ASSERTIONS','score-exp027','test-score-exp027',
            'AUTHORING_AUDIT','QUALIFICATION_REVIEW','RESULTS',
            'experiments/027/evidence','experiments/019','experiments/026',
            'AGENTS.md','README.md','STATUS.md'
          ];
          for(const item of forbidden){
            if(paths.some(path=>path.includes(item))) throw new Error('forbidden cold input '+item);
          }
          console.log('dry_packet_sha256='+dry.packet_sha256);
          NODE

      - name: Execute isolated integration decoder
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/027/tools/run-exp027-cold.mjs

      - name: Verify packet identity and score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp027/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp027/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/027/tools/score-exp027.mjs

      - name: Persist integration evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/027/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp027/$f" ] && cp "out/exp027/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"

          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 027 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:research/dts-0.1
          fi

      - name: Enforce integrated qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = "success"
          test -f out/exp027/SCORE.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp027/SCORE.json','utf8'));console.log(JSON.stringify({disposition:s.disposition,integrated:s.integrated_with_dts,guards:s.guards},null,2));if(s.disposition!=='QUALIFIES')process.exit(1)"
