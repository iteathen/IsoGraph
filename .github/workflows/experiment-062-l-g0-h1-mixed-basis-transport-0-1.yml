name: Experiment 062 L G0 mixed output basis and Jacobi-source guard 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/tools/verify-l-g0-l039-mixed-output-basis-transport-0-1.mjs'
      - 'experiments/062/tools/verify-l-g0-l039-direct-pauli-mixed-transport-0-1.mjs'
      - 'research/woit-lisi-isomorph/lisi/LISI_L01_H1_MIXED_BASIS_TRANSPORT_G0_0_1.json'
      - '.github/workflows/experiment-062-l-g0-h1-mixed-basis-transport-0-1.yml'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_SEMANTIC_CENSUS_0_31.json'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_31.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-l-g0-l039-mixed-output-basis-transport-0-1.mjs
      - run: node experiments/062/tools/verify-l-g0-l039-direct-pauli-mixed-transport-0-1.mjs
