name: Experiment 062 L G0 original L04 figures source-to-SSC finite cold boundary 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_ORIGINAL_FIGURE_GRAPH_GLYPH_SSC_RECONCILIATION_G0_0_2.json'
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_SOURCE_FIRST_REVERSE_COVERAGE_0_11.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_SEMANTIC_CENSUS_0_78.json'
      - 'research/woit-lisi-isomorph/lisi/L_G0_SIX_ORIGINAL_FINITE_SOURCE_FIRST_CONVERGENCE_0_32.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_TRAVERSAL_LEDGER_0_49.json'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_142.json'
      - 'experiments/062/tools/verify-l-g0-l04-figures-to-SSC-source-cold-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-l04-figures-to-SSC-source-cold-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-L04-figures-to-SSC:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-figures-to-SSC-source-cold-0-1.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-figures-to-SSC-source-cold-0-1.mjs
