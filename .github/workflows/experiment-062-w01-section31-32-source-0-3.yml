name: Experiment 062 W01 section 3 source correction and G0 gate 0.3
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_61.json'
      - 'experiments/062/tools/verify-w01-section31-32-source-0-2.mjs'
      - 'experiments/062/tools/verify-w01-section31-32-current-g0-gate-0-2.mjs'
      - 'experiments/062/W01_S31_32_NODE_GATE_VERIFIER_ALIAS_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-w01-section31-32-source-0-2.yml'
      - '.github/workflows/experiment-062-w01-section31-32-source-0-3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w01-section31-32-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-source-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section3-e0-quaternion-0-2.mjs
      - run: node experiments/062/tools/verify-w01-section31-32-current-g0-gate-0-2.mjs
