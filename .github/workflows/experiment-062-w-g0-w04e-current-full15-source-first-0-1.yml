      - name: Check syntax of independent original-source semantic and conservation validator
        run: node --check experiments/062/tools/verify-w-g0-w04e-full-current-original-15page-0-1.cjs
      - name: Verify 694 current original PDF source lines, 88 original intervals, all 151 SSC inverses, 539 typed source incidences and hostiles
        run: node experiments/062/tools/verify-w-g0-w04e-full-current-original-15page-0-1.cjs
