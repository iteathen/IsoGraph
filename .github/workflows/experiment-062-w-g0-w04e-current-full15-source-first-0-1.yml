name: "Experiment 062 W G0 W04e full current 15-page original-first source audit 0.1"
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - "research/woit-lisi-isomorph/woit/SOURCE_SEMANTIC_CENSUS_0_70.json"
      - "experiments/062/W04E_G0_ORIGINAL_10PAGE_CONTIGUOUS_SOURCE_FIRST_AUDIT_0_1.json"
      - "experiments/062/W04E_G0_ALL_15PAGE_CURRENT_AUTHOR_PDF_ORIGINAL_FIRST_CONVERGENCE_0_1.json"
      - "experiments/062/W_G0_ALL_151_SOURCE_MEMBERSHIP_REGISTER_0_56.json"
      - "experiments/062/W_G0_LINE_BY_LINE_151_COVERAGE_0_55.json"
      - "experiments/062/W_G0_NINE_SOURCE_COVERAGE_STATUS_0_37.json"
      - "experiments/062/W_CURRENT_STAGE_GATE_0_131.json"
      - "experiments/062/W_G0_FINITE_BIDIRECTIONAL_CONVERGENCE_0_9.json"
