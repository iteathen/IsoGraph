name: DTS long-payload provider probe

on:
  push:
    branches:
      - research/dts-0.1
    paths:
      - experiments/023/LONG_PROBE.request

permissions:
  contents: write

concurrency:
  group: dts-long-payload-provider-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Probe long-payload text models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/023/tools/probe-long-payload.mjs

      - name: Persist long-payload probe
        if: always()
        run: |
          set -euo pipefail
          test -f out/provider-long-probe/LONG_PROBE.json
          mkdir -p experiments/023/provider
          cp out/provider-long-probe/LONG_PROBE.json experiments/023/provider/LONG_PROBE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/023/provider/LONG_PROBE.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: record long-payload Gemini probe"
            git push origin HEAD:research/dts-0.1
          fi
