name: Experiment 062 L G0 exact rational octonion bivector
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_L05_O_RATIONAL_BIVECTOR_CERTIFICATE_G0_0_1.json'
      - 'experiments/062/tools/verify-l-g0-o-rational-bivector-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-o-rational-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-rational-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node --check experiments/062/tools/verify-l-g0-o-rational-bivector-0-1.mjs
      - run: node experiments/062/tools/verify-l-g0-o-rational-bivector-0-1.mjs
