      - 'experiments/062/L04_G0_ORIGINAL_TABLE1_TABLE2_INITIAL_49_HOSTILE_FAILURE_0_1.json'
      - 'experiments/062/tools/verify-l-g0-l04-table1-table2-source-cold-0-2.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_87.json'
