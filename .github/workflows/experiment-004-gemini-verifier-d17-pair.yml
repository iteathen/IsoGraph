name: Experiment 004 Gemini D17 Pair Verifiers

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/experiment-004-gemini-verifier-d17-pair.yml
      - experiments/004/tools/run-gemini-verifier.mjs

permissions:
  contents: read

concurrency:
  group: experiment-004-gemini-d17-pair
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-flash-lite-latest

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: [RUN-D17, RUN-D17B]
    steps:
      - name: Check out evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Fetch Claude evidence branch
        shell: bash
        run: git fetch origin experiment/004-cold-results-claude:refs/remotes/origin/experiment/004-cold-results-claude

      - name: Bound verifier output
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/maxOutputTokens: 65536/maxOutputTokens: 32768/' experiments/004/tools/run-gemini-verifier.mjs

      - name: Execute scorer-blind structural verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: ${{ matrix.run }}
        run: node experiments/004/tools/run-gemini-verifier.mjs

      - name: Emit verifier evidence to log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for p in out/*_VERIFIER_REPORT.txt out/*_VERIFIER_METADATA.json; do
            [ -f "$p" ] || continue
            found=1
            echo "===== BEGIN $(basename "$p") ====="
            cat "$p"
            echo "===== END $(basename "$p") ====="
          done
          echo "Evidence file hashes:"
          find out -maxdepth 2 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum
          test "$found" -eq 1