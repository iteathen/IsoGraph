name: Experiment 062 L G0 original L04 figures graph and glyph polarity 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_ORIGINAL_FIGURES_SOURCE_FULL_VERTEX_EDGE_INCIDENCE_G0_0_2.json'
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_ORIGINAL_FIGURE1_GLYPH_POLARITY_SOURCE_CELLS_0_2.json'
      - 'research/woit-lisi-isomorph/lisi/LISI_L04_ORIGINAL_FIGURE2_GLYPH_POLARITY_SOURCE_CELLS_0_2.json'
      - 'experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-2.mjs'
      - 'experiments/062/L04_FIGURES_FIRST_SOURCE_GRAPH_BASELINE_AND_GLYPH_METHOD_FAILURE_0_1.json'
      - '.github/workflows/experiment-062-l-g0-l04-original-figure-graph-reverse-0-2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L04-original-figures-graph-polarity:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-2.mjs
      - run: node experiments/062/tools/verify-l-g0-l04-original-full-figures-source-0-2.mjs
