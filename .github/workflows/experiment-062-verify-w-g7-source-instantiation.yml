name: Experiment 062 verify W G7 source instantiation

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/W_G7_VARIATIONAL_STATIONARITY_INSTANTIATION_0_1.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_2.json'
      - 'experiments/062/tools/verify-w-g7-variational-stationarity-instantiation-0-1.mjs'
      - '.github/workflows/experiment-062-verify-w-g7-source-instantiation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Verify W G7 source-local instantiation boundary
        run: node experiments/062/tools/verify-w-g7-variational-stationarity-instantiation-0-1.mjs
