name: Experiment 062 L G6 ordered-positivity provisional qualification

on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/L_G5H_ORDERED_POSITIVITY_SPLIT_WITNESS_0_1.json'
      - 'experiments/062/L_G6_ORDERED_POSITIVITY_SPLIT_MODULE_SSC_0_1.json'
      - 'experiments/062/L_G6_ORDERED_POSITIVITY_SPLIT_MODULE_IA_FIXED_POINT_0_1.json'
      - 'experiments/062/L_G6_FIELD_VECTOR_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/062/L_G6_COMPOSITION_ALGEBRA_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/062/tools/qualify-l-g6-ordered-positivity-split-witness-0-1.mjs'
      - 'research/woit-lisi-isomorph/lisi/LISI_PRIMITIVE_ORDERED_FIELD_POSDEF_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/lisi/LISI_PRIMITIVE_NEGATIVE_NORM_WITNESS_SCHEMA_0_1.isg'
      - '.github/workflows/experiment-062-l-g6-ordered-positivity-provisional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/qualify-l-g6-ordered-positivity-split-witness-0-1.mjs
