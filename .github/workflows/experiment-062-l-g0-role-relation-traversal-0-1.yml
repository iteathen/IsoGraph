name: Experiment 062 L G0 source role and traversal reconciliation 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_G0_SOURCE_NATIVE_ROLE_RELATIONS_0_1.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_SEMANTIC_CENSUS_0_49.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_TRAVERSAL_LEDGER_0_12.json'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_57.json'
      - 'experiments/062/tools/verify-l-g0-source-role-and-traversal-reconciliation-0-1.mjs'
      - '.github/workflows/experiment-062-l-g0-role-relation-traversal-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-roles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-l-g0-source-role-and-traversal-reconciliation-0-1.mjs
