name: Experiment 062 W corrected G3 gate
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W_G3_FIXED_POINT_0_6.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_6.json'
      - 'experiments/062/tools/verify-w-g3-fixed-point-0-6.mjs'
      - '.github/workflows/experiment-062-w-g3-fixed-point-0-6.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w-g3-fixed-point-0-6.mjs
