name: Experiment 004 Gemini C2 Independent Verifier

on:
  push:
    branches:
      - experiment/004-gemini-results
    paths:
      - .github/workflows/experiment-004-gemini-verifier-c2.yml

permissions:
  contents: read

env:
  GEMINI_MODEL: gemini-3.7-flash

jobs:
  verify-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: experiment/004-gemini-results

      - name: Fetch Claude evidence branch
        shell: bash
        run: git fetch origin experiment/004-cold-results-claude:refs/remotes/origin/experiment/004-cold-results-claude

      - name: Execute scorer-blind C2 verifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: RUN-C2
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}"
          sed -i 's/maxOutputTokens: 65536/maxOutputTokens: 32768/' experiments/004/tools/run-gemini-verifier.mjs
          node experiments/004/tools/run-gemini-verifier.mjs

      - name: Emit verifier evidence to log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for p in out/*_VERIFIER_REPORT.txt out/*_VERIFIER_METADATA.json; do
            [ -f "$p" ] || continue
            found=1
            echo "===== BEGIN $(basename "$p") ====="
            cat "$p"
            echo "===== END $(basename "$p") ====="
          done
          echo "Evidence file hashes:"
          find out -maxdepth 2 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum
          test "$found" -eq 1