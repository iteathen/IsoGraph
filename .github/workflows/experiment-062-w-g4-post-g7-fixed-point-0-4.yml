name: Experiment 062 W post-G7 G4 fixed point

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/W_G4_FIXED_POINT_0_4.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_20.json'
      - 'experiments/062/tools/verify-w-g4-post-g7-fixed-point-0-4.mjs'
      - '.github/workflows/experiment-062-w-g4-post-g7-fixed-point-0-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - run: node experiments/062/tools/verify-w-g4-post-g7-fixed-point-0-4.mjs
