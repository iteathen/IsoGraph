name: Experiment 062 L G6 composition-algebra provisional qualification

on:
  push:
    branches:
      - research/woit-lisi-isomorph-20261003
    paths:
      - 'experiments/062/L_G5H_COMPOSITION_ALGEBRA_SUPPORT_0_1.json'
      - 'experiments/062/L_G6_COMPOSITION_ALGEBRA_MODULE_SSC_0_1.json'
      - 'experiments/062/L_G6_COMPOSITION_ALGEBRA_MODULE_IA_FIXED_POINT_0_1.json'
      - 'experiments/062/L_G6_FIELD_VECTOR_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/062/L_G6_LINEAR_BASIS_PROVISIONAL_QUALIFICATION_0_1.json'
      - 'experiments/062/tools/qualify-l-g6-composition-algebra-support-0-1.mjs'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_GROUP_LIE_REP_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_ALGEBRA_CLIFFORD_TRIALITY_SCHEMA_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_ALGEBRA_ANTIINVOLUTION_SIDE_SWAP_0_1.isg'
      - 'research/woit-lisi-isomorph/support/PRIMITIVE_COMPOSITION_ANTIINVOLUTION_SCHEMA_0_1.isg'
      - '.github/workflows/experiment-062-l-g6-composition-algebra-provisional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.7.0'
      - name: Run deterministic G6 composition-algebra qualification
        run: node experiments/062/tools/qualify-l-g6-composition-algebra-support-0-1.mjs
