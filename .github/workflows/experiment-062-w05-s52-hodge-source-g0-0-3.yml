      - 'experiments/062/W05_G0_S52_HODGE_*.json'
      - 'experiments/062/W_CURRENT_STAGE_GATE_0_90.json'
      - 'experiments/062/W_G0_ALL_151_SOURCE_MEMBERSHIP_REGISTER_0_29.json'
