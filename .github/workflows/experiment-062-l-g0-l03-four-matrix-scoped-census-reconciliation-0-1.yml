name: Experiment 062 L G0 L03 four matrix source SSC conservation 0.1
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'research/woit-lisi-isomorph/lisi/LISI_L03_SOURCE_FIRST_REVERSE_COVERAGE_0_10.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_SEMANTIC_CENSUS_0_68.json'
      - 'research/woit-lisi-isomorph/lisi/L_G0_SIX_ORIGINAL_FINITE_SOURCE_FIRST_CONVERGENCE_0_20.json'
      - 'research/woit-lisi-isomorph/lisi/SOURCE_TRAVERSAL_LEDGER_0_37.json'
      - 'experiments/062/L03_FOUR_ORIGINAL_SOURCE_MATRIX_TABLES_24_HOSTILE_VERIFIED_0_1.json'
      - 'experiments/062/tools/verify-l-g0-l03-four-original-scoped-census-promotion-0-1.mjs'
      - 'experiments/062/L_CURRENT_STAGE_GATE_0_119.json'
      - '.github/workflows/experiment-062-l-g0-l03-four-matrix-scoped-census-reconciliation-0-1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  L03-four-original-source-SSC-conservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: node --check experiments/062/tools/verify-l-g0-l03-four-original-scoped-census-promotion-0-1.mjs
      - run: node experiments/062/tools/verify-l-g0-l03-four-original-scoped-census-promotion-0-1.mjs
