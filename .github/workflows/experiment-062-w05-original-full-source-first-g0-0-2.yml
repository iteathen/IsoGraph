name: Experiment 062 W05 original source-first corrected 0.2
on:
  push:
    branches: [research/woit-lisi-isomorph-20261003]
    paths:
      - 'experiments/062/W05_G0_VERSIONED_FULL_SOURCE_FIRST_PDF_HTML_0_2.json'
      - 'experiments/062/tools/verify-w05-original-full-source-first-g0-0-2.cjs'
      - '.github/workflows/experiment-062-w05-original-full-source-first-g0-0-2.yml'
      - 'research/woit-lisi-isomorph/woit/README.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26.7.0'}
      - run: node experiments/062/tools/verify-w05-original-full-source-first-g0-0-2.cjs
