name: Experiment 049 DP 0.8 qualification

on:
  push:
    branches:
      - qualification/core020-dp08-20260928
    paths:
      - experiments/049/RUN.request

permissions:
  contents: write

concurrency:
  group: experiment-049-dp-0-8
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3-flash-preview
  GEMINI_FALLBACK_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.1-pro-preview,gemini-3.1-flash-lite,gemini-pro-latest

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.7.0

      - name: Deterministic DP 0.8 preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/049/tools/run-exp049-cold.mjs
          node --check experiments/049/tools/score-exp049.mjs
          node --check experiments/049/tools/test-score-exp049.mjs
          node --check experiments/049/tools/test-runner-exp049.mjs
          node --check experiments/049/tools/test-schema-exp049.mjs
          node experiments/049/tools/test-schema-exp049.mjs
          node experiments/049/tools/test-score-exp049.mjs
          node experiments/049/tools/test-runner-exp049.mjs

          rm -rf out/exp049
          ISOGRAPH_COLD_DRY_RUN=1 node experiments/049/tools/run-exp049-cold.mjs

          node - <<'NODE'
          const fs=require('fs');
          const dry=JSON.parse(fs.readFileSync('out/exp049/DRY_RUN.json','utf8'));
          if(dry.case_count!==24) throw new Error('case count mismatch');
          if(!/^[0-9a-f]{64}$/.test(dry.dp_0_8_sha256)) throw new Error('DP 0.8 SHA-256 missing');
          console.log(JSON.stringify({
            packet_sha256:dry.packet_sha256,
            dp_0_8_sha256:dry.dp_0_8_sha256,
            case_count:dry.case_count
          },null,2));
          NODE

      - name: Execute isolated DP 0.8 decoder
        id: cold
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node experiments/049/tools/run-exp049-cold.mjs

      - name: Verify packet identity and hidden score
        id: score
        if: always() && steps.cold.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dry=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp049/DRY_RUN.json','utf8')).packet_sha256)")
          live=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('out/exp049/METADATA.json','utf8')).packet_sha256)")
          test "$dry" = "$live"
          node experiments/049/tools/score-exp049.mjs

      - name: Persist Experiment 049 evidence
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          E="experiments/049/evidence/run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$E"
          for f in DRY_RUN.json INPUT_MANIFEST.json METADATA.json COLD_REPORT_RAW.txt PARSED_REPORT.json SCORE.json; do
            [ -f "out/exp049/$f" ] && cp "out/exp049/$f" "$E/$f"
          done
          printf '{"workflow_run_id":"%s","workflow_attempt":"%s","source_sha":"%s","cold_outcome":"%s","score_outcome":"%s"}\n'             "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$COLD_OUTCOME" "$SCORE_OUTCOME" > "$E/CONTROL.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$E"
          if ! git diff --cached --quiet; then
            git commit -m "evidence: Experiment 049 run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git fetch origin qualification/core020-dp08-20260928
            git rebase origin/qualification/core020-dp08-20260928
            git push origin HEAD:qualification/core020-dp08-20260928
          fi

      - name: Enforce DP 0.8 qualification
        if: always()
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COLD_OUTCOME" = "success"
          test "$SCORE_OUTCOME" = "success"
          test -f out/exp049/SCORE.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('out/exp049/SCORE.json','utf8'));console.log(JSON.stringify({disposition:s.disposition,dp:s.dp_0_8,guards:s.guards},null,2));if(s.disposition!=='QUALIFIES')process.exit(1)"
