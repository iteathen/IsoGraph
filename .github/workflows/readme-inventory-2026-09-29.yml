name: One-shot README inventory 2026-09-29

on:
  push:
    branches:
      - docs/readme-mission-alignment-20260929
    paths:
      - maintenance/README_INVENTORY_2026-09-29.request

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Inventory README surfaces
        run: |
          set -euo pipefail
          {
            echo "# README Inventory — 2026-09-29"
            echo
            echo "Generated from commit: `$GITHUB_SHA`"
            echo
            find . -type f \( -iname 'README.md' -o -iname 'README*.md' \) \
              ! -path './.git/*' ! -path './out/*' | sed 's#^./##' | sort | while read -r f; do
                lines=$(wc -l < "$f")
                bytes=$(stat -c %s "$f")
                sha=$(sha256sum "$f" | awk '{print $1}')
                first=$(grep -m1 -E '^#+' "$f" || true)
                printf -- '- `%s` | lines=%s | bytes=%s | sha256=%s | first_heading=%s\n' "$f" "$lines" "$bytes" "$sha" "$first"
              done
          } > maintenance/README_INVENTORY_2026-09-29.md
      - name: Persist inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/README_INVENTORY_2026-09-29.md
          git commit -m "maintenance: inventory README surfaces"
          git fetch origin docs/readme-mission-alignment-20260929
          git rebase origin/docs/readme-mission-alignment-20260929
          git push origin HEAD:docs/readme-mission-alignment-20260929
